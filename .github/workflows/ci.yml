name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "packages/granite_core[dev]" -e "workflows/refund_desk[dev]" -e "apps/api[dev]"
      - name: Lint (ruff)
        run: |
          ruff check packages/granite_core workflows/refund_desk apps/api scripts
      - name: Types (mypy, strict)
        run: |
          (cd packages/granite_core && mypy granite_core)
          (cd workflows/refund_desk && mypy refund_desk)
          (cd apps/api && mypy granite_api)
      - name: Tests - core
        run: cd packages/granite_core && pytest --cov=granite_core --cov-report=term-missing --cov-fail-under=90
      - name: Tests - Refund Desk workflow
        run: cd workflows/refund_desk && pytest
      - name: Tests - API
        run: cd apps/api && pytest --cov=granite_api --cov-report=term-missing --cov-fail-under=90
      - name: Security - bandit (medium and above)
        run: bandit -q -r packages/granite_core/granite_core workflows/refund_desk/refund_desk apps/api/granite_api -ll
      - name: Security - known vulnerabilities in dependencies
        run: pip-audit --skip-editable
      - name: Generated files match the code (trace schema, diagrams)
        run: |
          python scripts/export_trace_schema.py --check
          python scripts/export_diagrams.py --check
          python scripts/check_traceability.py --check
      - name: Workspace and link hygiene
        run: |
          python scripts/check_workspace.py
          python scripts/check_links.py

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t granite:ci .
      - name: Start
        run: docker run -d --name granite -p 8000:8000 granite:ci
      - name: Smoke test (health, UI, recorded run, finding)
        run: bash scripts/smoke-test.sh http://127.0.0.1:8000
      - name: Logs on failure
        if: failure()
        run: docker logs granite
