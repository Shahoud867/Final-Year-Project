<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14; --bg-elevated:#11151f; --surface:#151a26; --surface-hover:#1a2030;
    --border:#232a3d; --border-strong:#323b54;
    --text:#e9ecf5; --text-secondary:#a2aac2; --text-muted:#6b7389;
    --accent:#d9a15c; --accent-strong:#eab578; --accent-soft:rgba(217,161,92,.14);
    --blue:#6ea8e0; --blue-soft:rgba(110,168,224,.14);
    --green:#52c98c; --green-soft:rgba(82,201,140,.14);
    --amber:#e0b555; --amber-soft:rgba(224,181,85,.14);
    --red:#e06868; --red-soft:rgba(224,104,104,.14);
    --teal:#52b8c9; --teal-soft:rgba(82,184,201,.14);
    --orange:#e08a55; --orange-soft:rgba(224,138,85,.14);
    --radius-sm:6px; --radius:10px; --radius-lg:14px;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);
    --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:var(--font-ui);font-size:14px;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
  .mono{font-family:var(--font-mono);}
  code{font-family:var(--font-mono);}
  h1,h2,h3,h4{margin:0;}
  p{margin:0;}
  a{color:inherit;}

  #app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100vh;
    grid-template-areas:"top top" "nav main";}
  #topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg-elevated);flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#a56a2b);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#1a1204;}
  .brand-name{font-weight:800;font-size:14.5px;letter-spacing:-0.01em;}
  .brand-sub{font-size:10.5px;color:var(--text-muted);margin-top:-2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .status-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--font-mono);
    padding:5px 10px;border-radius:999px;background:var(--green-soft);color:var(--green);border:1px solid var(--green);}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse2 1.6s infinite;}
  @keyframes pulse2{0%,100%{opacity:1;}50%{opacity:.4;}}

  #nav{grid-area:nav;border-right:1px solid var(--border);background:var(--bg-elevated);
    padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer;
    font-size:12.8px;font-weight:600;color:var(--text-secondary);border:1px solid transparent;
    transition:background .12s,color .12s;}
  .navitem:hover{background:var(--surface-hover);}
  .navitem.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text);}
  .navitem .ic{width:16px;text-align:center;opacity:.85;flex-shrink:0;}
  .navgap{flex:1;}
  .navfoot{padding:10px 4px 2px;border-top:1px solid var(--border);margin-top:6px;}
  .navfoot .t{font-size:10px;color:var(--text-muted);line-height:1.5;}
  .navfoot .t b{color:var(--accent-strong);}

  main{grid-area:main;overflow-y:auto;position:relative;}
  .view{display:none;padding:26px 32px 60px;max-width:1360px;margin:0 auto;}
  .view.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .view-eyebrow{font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent-strong);}
  .view-title{font-size:23px;font-weight:800;margin:3px 0 6px;letter-spacing:-0.01em;}
  .view-sub{font-size:12.8px;color:var(--text-secondary);max-width:82ch;line-height:1.6;margin-bottom:20px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);}
  .card-pad{padding:16px 18px;}
  .card-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .card-hd h4{font-size:12px;font-weight:700;letter-spacing:.02em;}
  .text-muted{color:var(--text-muted);}
  .text-sec{color:var(--text-secondary);}

  .badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9.5px;
    font-weight:700;padding:2.5px 8px;border-radius:999px;border:1px solid;white-space:nowrap;}
  .badge.real{color:var(--green);border-color:var(--green);background:var(--green-soft);}
  .badge.sim{color:var(--amber);border-color:var(--amber);background:var(--amber-soft);}
  .badge.planned{color:var(--text-muted);border-color:var(--border-strong);background:transparent;}
  .badge.api{color:var(--accent-strong);border-color:var(--accent);background:var(--accent-soft);}
  .badge.zeroapi{color:var(--blue);border-color:var(--blue);background:var(--blue-soft);}

  .disclaimer{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);
    border:1px solid var(--amber);border-radius:var(--radius);padding:11px 14px;margin-bottom:18px;}
  .disclaimer .ic{font-size:15px;line-height:1.3;flex-shrink:0;}
  .disclaimer .tt{font-weight:800;font-size:11px;color:var(--amber);letter-spacing:.03em;text-transform:uppercase;}
  .disclaimer .bd{font-size:11.8px;color:var(--text-secondary);line-height:1.55;margin-top:2px;}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-size:11px;color:var(--text-muted);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}

  /* ============ ARCHITECTURE VIEW ============ */
  .modstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .modcard{border-radius:var(--radius);padding:13px 15px;border:1px solid var(--border);background:var(--surface);
    border-top:3px solid var(--teal);}
  .modcard.b{border-top-color:var(--orange);}
  .modcard.c{border-top-color:var(--blue);}
  .modcard h5{font-size:12.5px;font-weight:800;margin-bottom:3px;}
  .modcard .own{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted);margin-bottom:8px;}
  .modcard ul{margin:0;padding-left:15px;font-size:10.8px;color:var(--text-secondary);line-height:1.7;}

  .archgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:8px;}
  .archnode{border-radius:var(--radius);border:1.5px solid var(--border-strong);background:var(--surface);
    padding:12px 12px;cursor:pointer;transition:all .15s ease;position:relative;}
  .archnode:hover{border-color:var(--accent);transform:translateY(-2px);}
  .archnode.selected{border-color:var(--accent);background:var(--accent-soft);}
  .archnode .lane{position:absolute;top:0;left:0;width:100%;height:3px;border-radius:3px 3px 0 0;}
  .archnode .name{font-size:11.5px;font-weight:700;margin:5px 0 4px;}
  .archnode .desc{font-size:9.8px;color:var(--text-muted);line-height:1.4;}
  .archnode .badges{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;}
  .archrow-lbl{font-family:var(--font-mono);font-size:9px;color:var(--text-muted);text-transform:uppercase;
    letter-spacing:.06em;margin:14px 0 6px;}

  #nodeDetail{margin-top:16px;}
  .nd-empty{padding:26px;text-align:center;color:var(--text-muted);font-size:12px;}
  .nd-row{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:11.5px;}
  .nd-row:last-child{border-bottom:none;}
  .nd-row .k{width:110px;flex-shrink:0;color:var(--text-muted);font-family:var(--font-mono);font-size:10px;
    text-transform:uppercase;letter-spacing:.03em;padding-top:2px;}
  .nd-row .v{color:var(--text-secondary);line-height:1.55;}

  .checklist{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .chk{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;background:var(--surface);
    border:1px solid var(--border);font-size:11px;}
  .chk .dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;margin-top:1px;}
  .chk.t1 .dot{background:var(--green-soft);color:var(--green);border:1px solid var(--green);}
  .chk.t2 .dot{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);}
  .chk b{color:var(--text);}
  .chk .s{color:var(--text-muted);}

  /* ============ SDK VIEW ============ */
  .sdklayout{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start;}
  @media(max-width:980px){.sdklayout{grid-template-columns:1fr;}}
  .tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:0;}
  .tabbtn{padding:9px 14px;font-size:11px;font-weight:700;font-family:var(--font-mono);color:var(--text-muted);
    background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;}
  .tabbtn.active{color:var(--accent-strong);border-bottom-color:var(--accent);}
  .codepanel{background:#0a0d13;border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);
    padding:16px 18px;font-family:var(--font-mono);font-size:11.8px;line-height:1.75;color:#cdd6e6;
    white-space:pre;overflow-x:auto;min-height:230px;}
  .codepanel .c1{color:var(--blue);} .codepanel .c2{color:var(--green);} .codepanel .c3{color:var(--amber);}
  .codepanel .c4{color:var(--text-muted);font-style:italic;} .codepanel .c5{color:var(--accent-strong);}
  .runbtn{margin-top:10px;background:var(--accent);color:#1a1204;border:none;padding:8px 16px;border-radius:8px;
    font-size:11.5px;font-weight:800;cursor:pointer;font-family:var(--font-mono);}
  .runbtn:hover{background:var(--accent-strong);}
  .termpanel{background:#05070a;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
    font-family:var(--font-mono);font-size:11px;line-height:1.7;color:#8fe6ac;min-height:230px;overflow-y:auto;max-height:340px;}
  .termpanel .tl{margin-bottom:1px;white-space:pre-wrap;word-break:break-word;}
  .termpanel .tl.dim{color:#4a6b5f;}
  .termpanel .cursor2{display:inline-block;width:7px;height:12px;background:var(--accent);animation:blink2 1s step-end infinite;vertical-align:middle;}
  @keyframes blink2{50%{opacity:0;}}

  .apigrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .apicard{border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);padding:12px 14px;}
  .apicard .sig{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--accent-strong);margin-bottom:5px;}
  .apicard .desc{font-size:10.8px;color:var(--text-secondary);line-height:1.55;margin-bottom:6px;}
  .apicard .io{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted);}

  /* ============ PIPELINE (RUN DEMO) VIEW ============ */
  .runbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  #bigStart{background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#1a1204;border:none;
    padding:12px 26px;font-size:14px;font-weight:800;border-radius:10px;cursor:pointer;
    box-shadow:0 6px 20px rgba(217,161,92,.3);}
  #bigStart:hover{transform:translateY(-1px);}
  #bigStart:disabled{opacity:.4;cursor:default;transform:none;}
  .stepper2{display:flex;gap:6px;flex:1;min-width:260px;}
  .pill2{flex:1;padding:7px 4px;border-radius:8px;background:var(--surface);border:1px solid var(--border);
    text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--text-muted);transition:all .2s;}
  .pill2.active{border-color:var(--amber);color:var(--amber);background:var(--amber-soft);}
  .pill2.done{border-color:var(--green);color:var(--text-secondary);}

  .pipelayout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;}
  @media(max-width:1080px){.pipelayout{grid-template-columns:1fr;}}
  #stageStage{min-height:420px;}
  .stagehead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
  .stagehead h3{font-size:17px;}
  .stagehead .tag{font-size:10px;font-family:var(--font-mono);background:var(--surface-hover);
    border:1px solid var(--border);color:var(--text-muted);padding:2px 8px;border-radius:6px;}
  .stagecap{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:0 var(--radius) var(--radius) 0;padding:11px 15px;font-size:12.5px;line-height:1.6;
    color:var(--text-secondary);margin-bottom:14px;}
  .stagecap b{color:var(--accent-strong);}
  .novelty-callout{background:var(--blue-soft);border:1px solid var(--blue);border-radius:var(--radius);
    padding:12px 15px;margin-top:14px;font-size:11.8px;line-height:1.6;}
  .novelty-callout .tt{font-weight:800;color:var(--blue);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;}

  .tracerig2{display:flex;align-items:center;justify-content:center;gap:0;margin:18px 0 10px;flex-wrap:wrap;}
  .tnode2{width:150px;padding:12px 10px;border-radius:11px;background:var(--surface);border:1.5px solid var(--border);
    text-align:center;transition:all .4s ease;opacity:.4;transform:scale(.92);}
  .tnode2.appear{opacity:1;transform:scale(1);}
  .tnode2.fault{border-color:var(--red);box-shadow:0 0 18px rgba(224,104,104,.25);}
  .tnode2.good{border-color:var(--green);box-shadow:0 0 18px rgba(82,201,140,.25);}
  .tnode2 .nm{font-size:11px;font-weight:700;}
  .tnode2 .vl{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:3px;}
  .tnode2 .badge{margin-top:6px;}
  .tedge2{width:36px;height:2px;background:var(--border);margin-top:-24px;opacity:0;transition:opacity .3s;flex-shrink:0;}
  .tedge2.appear{opacity:1;background:var(--accent);}

  .sidepanel{position:sticky;top:0;}
  .archmini{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:12px;}
  .archmini h5{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:10px;}
  .aminode{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;font-size:10.8px;color:var(--text-muted);
    border:1px solid transparent;margin-bottom:2px;transition:all .3s ease;}
  .aminode .dot2{width:7px;height:7px;border-radius:50%;background:var(--border-strong);flex-shrink:0;}
  .aminode.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text);font-weight:700;}
  .aminode.active .dot2{background:var(--amber);box-shadow:0 0 0 3px rgba(224,181,85,.25);animation:pulse2 1.2s infinite;}
  .aminode.done{color:var(--text-secondary);}
  .aminode.done .dot2{background:var(--green);}

  .logpanel{background:#05070a;border:1px solid var(--border);border-radius:var(--radius);height:260px;
    overflow-y:auto;padding:10px 12px;font-family:var(--font-mono);font-size:10px;line-height:1.65;color:#8fe6ac;}
  .logpanel h5{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:8px;
    font-family:var(--font-ui);}
  .logln{margin-bottom:1px;white-space:pre-wrap;word-break:break-word;}
  .logln .t{color:#3d5c50;margin-right:5px;}

  /* ============ NOVELTY VIEW ============ */
  .vscols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  @media(max-width:820px){.vscols{grid-template-columns:1fr;}}
  .vscard{border-radius:var(--radius);overflow:hidden;border:2px solid var(--border);}
  .vscard .hd{padding:10px 14px;font-weight:800;font-size:11.5px;letter-spacing:.02em;}
  .vscard.base .hd{background:var(--red-soft);color:var(--red);}
  .vscard.base{border-color:var(--red);}
  .vscard.gran .hd{background:var(--green-soft);color:var(--green);}
  .vscard.gran{border-color:var(--green);}
  .vscard .bd{padding:14px;background:var(--surface);}
  .vsstep{display:flex;gap:8px;padding:6px 0;font-size:11.3px;color:var(--text-secondary);align-items:flex-start;}
  .vsstep .n2{font-family:var(--font-mono);color:var(--text-muted);flex-shrink:0;width:16px;}
  .vsverdict{margin-top:10px;padding:9px 12px;border-radius:8px;font-size:11.5px;font-weight:700;}
  .vsverdict.miss{background:var(--red-soft);color:var(--red);}
  .vsverdict.catch{background:var(--green-soft);color:var(--green);}

  .barrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .barrow .lbl{width:190px;flex-shrink:0;font-size:11px;color:var(--text-secondary);}
  .barrow .track{flex:1;height:20px;background:var(--surface-hover);border-radius:6px;overflow:hidden;border:1px solid var(--border);}
  .barrow .fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#0a0d13;font-family:var(--font-mono);font-size:9.5px;font-weight:800;}

  .noveltylist{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:6px;}
  .novitem{border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);padding:13px 14px;
    border-top:3px solid var(--accent);}
  .novitem h5{font-size:11.8px;font-weight:800;margin-bottom:6px;}
  .novitem p{font-size:10.8px;color:var(--text-secondary);line-height:1.55;}

  /* ============ EVALUATION VIEW ============ */
  .metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
  @media(max-width:900px){.metricgrid{grid-template-columns:repeat(2,1fr);}}
  .metriccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
  .metriccard .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:700;}
  .metriccard .val{font-size:20px;font-weight:800;margin-top:4px;font-family:var(--font-mono);}
  .metriccard .sub{font-size:9.5px;color:var(--text-muted);margin-top:3px;}

  .bandstrip{display:flex;gap:8px;margin-bottom:20px;}
  .band2{flex:1;text-align:center;padding:10px 6px;border-radius:8px;font-family:var(--font-mono);font-size:10px;
    border:1.5px solid;}
  .band2.fail{border-color:var(--red);color:var(--red);}
  .band2.ok3{border-color:var(--text-muted);color:var(--text-muted);}
  .band2.strong{border-color:var(--teal);color:var(--teal);}
  .band2.exc{border-color:var(--green);color:var(--green);}

  table.spiketbl{width:100%;border-collapse:collapse;font-size:11px;}
  table.spiketbl th,table.spiketbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top;}
  table.spiketbl th{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);}
  table.spiketbl tr:last-child td{border-bottom:none;}

  #advanceHint2{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:10.5px;
    color:var(--text-muted);background:var(--bg-elevated);border:1px solid var(--border);padding:5px 13px;
    border-radius:20px;opacity:.85;z-index:20;}
  kbd{background:var(--surface-hover);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:var(--font-mono);}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div>
        <div class="brand-name">Granite</div>
        <div class="brand-sub">Live System Demonstration</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="status-pill"><span class="status-dot"></span>8 spikes verified · $0 budget</span>
    </div>
  </div>

  <nav id="nav"></nav>

  <main id="main"></main>

function gotoStage(i){

  clearTimeout(pAutoTimer); pLogTimers.forEach(clearTimeout); pLogTimers = [];
  const view = document.getElementById("view-pipeline");
  $$(".pill2", view).forEach((p, idx) => { p.classList.toggle("active", idx===i); p.classList.toggle("done", idx<i); });
  $$(".aminode", view).forEach(a => {
    a.classList.remove("active","done");

    const activeIdx = PIPE_ARCH_ORDER.indexOf(STAGES2[i].archActive);

  const logWrap = $("#pipeLog", view);
  logWrap.innerHTML = "";
  STAGES2[i].logs.forEach((pair, idx) => {

function typeTerm(box, lines, finalLine){
  box.innerHTML = '<span class="cursor2"></span>';
  let delay = 0;
  lines.forEach(line => { delay += 420; setTimeout(()=>{
    const cur = box.querySelector(".cursor2"); const d = document.createElement("div"); d.textContent = line; box.insertBefore(d, cur);
  }, delay); });
  delay += 550;
  setTimeout(()=>{ const cur = box.querySelector(".cursor2"); const d = document.createElement("div");
    d.style.color = "var(--red)"; d.style.fontWeight = "700"; d.textContent = finalLine; box.insertBefore(d, cur); }, delay);
}
