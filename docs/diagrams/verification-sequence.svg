<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1531 1104" width="1531" height="1104" role="img" aria-labelledby="verification-sequence-t verification-sequence-d" data-diagram="verification-sequence"><title id="verification-sequence-t">Sequence diagram: verify a hypothesis</title><desc id="verification-sequence-d">From pressing Verify to a verdict.</desc><style>text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;} .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;} .node:focus{outline:none;} .node:focus > :first-child, .node:focus > rect{stroke-width:2.6;}</style><defs><marker id="verification-sequence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b8696"/></marker><marker id="verification-sequence-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7b8696" stroke-width="1.6"/></marker><marker id="verification-sequence-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="verification-sequence-diamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#7b8696"/></marker><marker id="verification-sequence-odiamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="verification-sequence-many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M2 6 L12 1 M2 6 L12 11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="verification-sequence-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M7 1 V11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="verification-sequence-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#7b8696"/></marker></defs><rect width="1531" height="1104" fill="#ffffff"/><path d="M95 86 V1084" stroke="#7b8696" stroke-width="1.1" stroke-dasharray="5 5" fill="none"/><path d="M273 86 V1084" stroke="#7b8696" stroke-width="1.1" stroke-dasharray="5 5" fill="none"/><path d="M451 86 V1084" stroke="#7b8696" stroke-width="1.1" stroke-dasharray="5 5" fill="none"/><path d="M629 86 V1084" stroke="#7b8696" stroke-width="1.1" stroke-dasharray="5 5" fill="none"/><path d="M807 86 V1084" stroke="#7b8696" stroke-width="1.1" stroke-dasharray="5 5" fill="none"/><path d="M985 86 V1084" stroke="#7b8696" stroke-width="1.1" stroke-dasharray="5 5" fill="none"/><path d="M1163 86 V1084" stroke="#7b8696" stroke-width="1.1" stroke-dasharray="5 5" fill="none"/><path d="M1341 86 V1084" stroke="#7b8696" stroke-width="1.1" stroke-dasharray="5 5" fill="none"/><g class="frame"><rect x="367" y="272.0" width="702" height="46.0" rx="4" fill="#f6f8fb" fill-opacity="0.75" stroke="#9aa4b1" stroke-width="1.1"/><path d="M367 272.0 H396.1758 V285.0 L389.1758 292.0 H367 Z" fill="#ffffff" stroke="#9aa4b1" stroke-width="1.1"/><text x="374" y="286.0" style="font-size:11px;font-weight:700;fill:#1b2430">alt</text><text x="404.1758" y="286.0" style="font-size:11px;font-style:italic;fill:#586474">[no repair rule, or the state forbids it]</text></g><g class="frame"><rect x="545" y="524.0" width="880" height="268.0" rx="4" fill="#f6f8fb" fill-opacity="0.75" stroke="#9aa4b1" stroke-width="1.1"/><path d="M545 524.0 H583.0374 V537.0 L576.0374 544.0 H545 Z" fill="#ffffff" stroke="#9aa4b1" stroke-width="1.1"/><text x="552" y="538.0" style="font-size:11px;font-weight:700;fill:#1b2430">loop</text><text x="591.0374" y="538.0" style="font-size:11px;font-style:italic;fill:#586474">[N replays with the fix, then M controls]</text></g><g class="edge" data-from="analyst" data-to="ui"><title>Verify (N, M)</title><path d="M95.0 132.0 L270.0 132.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="ui" data-to="api"><title>POST .../experiments</title><path d="M273.0 174.0 L448.0 174.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="api" data-to="svc"><title>create_experiment()</title><path d="M451.0 216.0 L982.0 216.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="svc" data-to="core"><title>build_intervention()</title><path d="M985.0 258.0 L1160.0 258.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="svc" data-to="api"><title>422 cannot verify / 409 allowed actions</title><path d="M985.0 300.0 L454.0 300.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#verification-sequence-open)"/></g><g class="edge" data-from="svc" data-to="db"><title>finding = verifying; experiment queued</title><path d="M985.0 342.0 L632.0 342.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="api" data-to="jobs"><title>submit(experiment job)</title><path d="M451.0 384.0 L804.0 384.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="api" data-to="ui"><title>202 experiment_id, job_id</title><path d="M451.0 426.0 L276.0 426.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#verification-sequence-open)"/></g><g class="edge" data-from="jobs" data-to="svc"><title>experiment_job()</title><path d="M807.0 468.0 L982.0 468.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="svc" data-to="core"><title>run_experiment(N, M)</title><path d="M985.0 510.0 L1160.0 510.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="core" data-to="core"><title>execute_replay: copy frozen steps</title><path d="M1163.0 552.0 L1198.0 552.0 Q1207.0 552.0 1207.0 561.0 L1207.0 563.0 Q1207.0 572.0 1198.0 572.0 L1166.0 572.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="core" data-to="model"><title>complete()</title><path d="M1163.0 600.0 L1338.0 600.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="model" data-to="core"><title>Completion</title><path d="M1341.0 642.0 L1166.0 642.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#verification-sequence-open)"/></g><g class="edge" data-from="core" data-to="core"><title>evaluate_checks, judge_replay</title><path d="M1163.0 684.0 L1198.0 684.0 Q1207.0 684.0 1207.0 693.0 L1207.0 695.0 Q1207.0 704.0 1198.0 704.0 L1166.0 704.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="core" data-to="svc"><title>on_replay(record)</title><path d="M1163.0 732.0 L988.0 732.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#verification-sequence-open)"/></g><g class="edge" data-from="svc" data-to="db"><title>store replay, progress</title><path d="M985.0 774.0 L632.0 774.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="core" data-to="core"><title>decide (VR-1), Wilson interval</title><path d="M1163.0 816.0 L1198.0 816.0 Q1207.0 816.0 1207.0 825.0 L1207.0 827.0 Q1207.0 836.0 1198.0 836.0 L1166.0 836.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="core" data-to="svc"><title>summary, replays</title><path d="M1163.0 864.0 L988.0 864.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#verification-sequence-open)"/></g><g class="edge" data-from="svc" data-to="db"><title>verdict, evidence, finding status</title><path d="M985.0 906.0 L632.0 906.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="ui" data-to="api"><title>GET /api/findings/{id}</title><path d="M273.0 948.0 L448.0 948.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#verification-sequence-arrow)"/></g><g class="edge" data-from="api" data-to="ui"><title>status, verdict, evidence</title><path d="M451.0 990.0 L276.0 990.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#verification-sequence-open)"/></g><g class="edge" data-from="ui" data-to="analyst"><title>verdict card</title><path d="M273.0 1032.0 L98.0 1032.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#verification-sequence-open)"/></g><g class="node" data-id="analyst" tabindex="0"><rect x="17" y="40" width="156" height="46" rx="7" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.4"/><text x="95.0" y="68.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Analyst</text></g><g class="node" data-id="ui" tabindex="0"><rect x="195" y="40" width="156" height="46" rx="7" fill="#f0eafc" stroke="#6f4fc7" stroke-width="1.4"/><text x="273.0" y="68.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Web UI</text></g><g class="node" data-id="api" tabindex="0"><rect x