<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Granite Architecture Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#faf6ef; --bg-elevated:#ffffff; --surface:#ffffff; --surface-2:#f4efe5;
    --border:#e7ddca; --border-strong:#d4c6a8;
    --text:#211c12; --text-secondary:#5c5440; --text-muted:#8c8368;
    --accent:#a96a1f; --accent-strong:#8a5417; --accent-soft:rgba(169,106,31,.12);
    --teal:#1f7d84; --teal-soft:rgba(31,125,132,.12);
    --orange:#b5601f; --orange-soft:rgba(181,96,31,.12);
    --blue:#2f5f9e; --blue-soft:rgba(47,95,158,.12);
    --green:#2f7a4f; --green-soft:rgba(47,122,79,.13);
    --amber:#93701a; --amber-soft:rgba(147,112,26,.14);
    --red:#a6392f; --red-soft:rgba(166,57,47,.12);
    --shadow:0 1px 2px rgba(40,30,10,.06), 0 10px 28px -16px rgba(40,30,10,.22);
    --font-display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
    --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0e14; --bg-elevated:#11151f; --surface:#151a26; --surface-2:#1a2030;
      --border:#232a3d; --border-strong:#323b54;
      --text:#e9ecf5; --text-secondary:#a2aac2; --text-muted:#6b7389;
      --accent:#d9a15c; --accent-strong:#eab578; --accent-soft:rgba(217,161,92,.16);
      --teal:#52b8c9; --teal-soft:rgba(82,184,201,.16);
      --orange:#e08a55; --orange-soft:rgba(224,138,85,.16);
      --blue:#6ea8e0; --blue-soft:rgba(110,168,224,.16);
      --green:#52c98c; --green-soft:rgba(82,201,140,.16);
      --amber:#e0b555; --amber-soft:rgba(224,181,85,.16);
      --red:#e06868; --red-soft:rgba(224,104,104,.16);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0e14; --bg-elevated:#11151f; --surface:#151a26; --surface-2:#1a2030;
    --border:#232a3d; --border-strong:#323b54;
    --text:#e9ecf5; --text-secondary:#a2aac2; --text-muted:#6b7389;
    --accent:#d9a15c; --accent-strong:#eab578; --accent-soft:rgba(217,161,92,.16);
    --teal:#52b8c9; --teal-soft:rgba(82,184,201,.16);
    --orange:#e08a55; --orange-soft:rgba(224,138,85,.16);
    --blue:#6ea8e0; --blue-soft:rgba(110,168,224,.16);
    --green:#52c98c; --green-soft:rgba(82,201,140,.16);
    --amber:#e0b555; --amber-soft:rgba(224,181,85,.16);
    --red:#e06868; --red-soft:rgba(224,104,104,.16);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-ui);
    font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .shell{display:grid; grid-template-columns:264px 1fr; min-height:100vh}
  @media (max-width:960px){ .shell{grid-template-columns:1fr} .nav{position:static; height:auto} }

  .nav{
    position:sticky; top:0; height:100vh; overflow-y:auto;
    background:var(--bg-elevated); border-right:1px solid var(--border);
    padding:22px 16px 18px; display:flex; flex-direction:column; gap:18px;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:2px 6px 12px; border-bottom:1px solid var(--border)}
  .brand-mark{
    width:34px; height:34px; border-radius:8px; flex:0 0 auto;
    background:linear-gradient(135deg, var(--accent), var(--orange));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:18px; color:var(--bg-elevated);
  }
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:.01em}
  .brand-sub{font-size:10.5px; color:var(--text-muted); margin-top:-2px; text-transform:uppercase; letter-spacing:.06em}

  .navgroup-label{font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--text-muted); padding:0 6px; margin-bottom:2px}
  .navlist{display:flex; flex-direction:column; gap:2px}
  .navitem{
    display:flex; align-items:baseline; gap:10px; padding:8px 8px; border-radius:8px;
    cursor:pointer; border:1px solid transparent; background:none; text-align:left; width:100%;
    font-family:var(--font-ui); color:var(--text-secondary);
  }
  .navitem:hover{background:var(--surface-2)}
  .navitem.active{background:var(--accent-soft); border-color:var(--accent); color:var(--text)}
  .navnum{font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--accent); flex:0 0 auto; width:16px}
  .navitem.active .navnum{color:var(--accent-strong)}
  .navtext{font-size:12.5px; font-weight:600; line-height:1.3}

  .legend{
    margin-top:auto; padding-top:14px; border-top:1px solid var(--border);
    display:flex; flex-direction:column; gap:6px;
  }
  .legend-row{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-secondary)}
  .swatch{width:11px; height:11px; border-radius:3px; flex:0 0 auto; border:1px solid var(--border-strong)}
  .swatch.dash{background:none; border:1.5px dashed var(--red)}

  main{min-width:0; padding:30px 40px 80px; max-width:1180px; margin:0 auto}
  .view{display:none}
  .view.active{display:block}

  .view-eyebrow{font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-strong)}
  .view-title{font-family:var(--font-display); font-size:34px; font-weight:700; letter-spacing:.005em; margin:2px 0 8px; text-wrap:balance}
  .view-purpose{font-size:14.5px; color:var(--text-secondary); max-width:74ch; margin:0 0 22px}

  figure{margin:0 0 22px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 18px 14px; box-shadow:var(--shadow)}
  figure svg{width:100%; height:auto; display:block; max-width:100%}
  figcaption{font-size:12px; color:var(--text-muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--border)}

  .infogrid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:8px}
  @media (max-width:760px){ .infogrid{grid-template-columns:1fr} }
  .infocard{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px}
  .infocard h4{margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); font-weight:700}
  .infocard p, .infocard ul{margin:0; font-size:13px; color:var(--text-secondary); line-height:1.55}
  .infocard ul{padding-left:18px}

  .badge{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid; margin-right:6px}
  .badge.t1{color:var(--green); border-color:var(--green); background:var(--green-soft)}
  .badge.t2{color:var(--amber); border-color:var(--amber); background:var(--amber-soft)}
  .badge.ext{color:var(--text-muted); border-color:var(--border-strong)}
  .badge.proposed{color:var(--red); border-color:var(--red); background:var(--red-soft)}

  table.matrix{width:100%; border-collapse:collapse; font-size:12.5px; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden}
  table.matrix th, table.matrix td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); vertical-align:top}
  table.matrix th{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); background:var(--surface-2)}
  table.matrix tr:last-child td{border-bottom:none}
  .tablewrap{overflow-x:auto; border-radius:12px}

  .gapslist{display:flex; flex-direction:column; gap:10px}
  .gapitem{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 16px; display:flex; gap:12px; align-items:flex-start}
  .gapitem .tag{font-family:var(--font-mono); font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; flex:0 0 auto; margin-top:2px}
  .tag.decision{background:var(--red-soft); color:var(--red)}
  .tag.proposed{background:var(--amber-soft); color:var(--amber)}

  svg text{font-family:var(--font-ui)}
  svg .mono{font-family:var(--font-mono)}
  svg .lbl-title{font-weight:700}
  svg .lbl-sub{font-weight:500}
  svg .grouplabel{font-family:var(--font-mono); font-weight:700; letter-spacing:.04em}
</style>

</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Diagram index">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div>
        <div class="brand-name">Granite</div>
        <div class="brand-sub">Architecture Atlas</div>
      </div>
    </div>

    <div>
      <div class="navgroup-label">Diagrams 1&ndash;9</div>
      <div class="navlist" id="navlist"></div>
    </div>

    <div>
      <div class="navgroup-label">Reference</div>
      <div class="navlist">
        <button class="navitem" data-target="matrix"><span class="navnum">M</span><span class="navtext">Coverage matrix</span></button>
        <button class="navitem" data-target="gaps"><span class="navnum">D</span><span class="navtext">Gaps &amp; decisions required</span></button>
      </div>
    </div>

    <div class="legend">
      <div class="legend-row"><span class="swatch" style="background:var(--teal-soft);border-color:var(--teal)"></span> Lane A &mdash; Data / Benchmark (Shahoud)</div>
      <div class="legend-row"><span class="swatch" style="background:var(--orange-soft);border-color:var(--orange)"></span> Lane B &mdash; Diagnosis (Noor)</div>
      <div class="legend-row"><span class="swatch" style="background:var(--blue-soft);border-color:var(--blue)"></span> Lane C &mdash; Platform (Saif)</div>
      <div class="legend-row"><span class="swatch" style="background:var(--green-soft);border-color:var(--green)"></span> Tier&nbsp;1 &mdash; evidenced, unconditional</div>
      <div class="legend-row"><span class="swatch" style="background:var(--amber-soft);border-color:var(--amber)"></span> Tier&nbsp;2 &mdash; gated, Mid-1 decision</div>
      <div class="legend-row"><span class="swatch dash"></span> External / not built by Granite</div>
    </div>
  </nav>

  <main id="main"></main>
</div>

<script>
const DIAGRAMS = [
  {id:1, title:"Overall System Architecture", eyebrow:"Diagram 1 of 9",
   purpose:"Where Granite sits relative to the system it watches, the three owner-lanes that make up the diagnosis platform, and the one external dependency (the LLM API) that isn't Granite's own code.",
   covers:"All 10 foundational mechanisms, grouped into their 3 owner lanes; the operator; the target multi-agent system; the LLM API boundary.",
   design:"A center-out layout: target system and operator sit outside the Granite boundary on either side; the three lanes are drawn as vertically stacked bands inside one dashed system boundary, matching the ownership split in the plan doc (§9) and the SDS's own component diagram (§4)."},
  {id:2, title:"End-to-End Data / Processing Pipeline", eyebrow:"Diagram 2 of 9",
   purpose:"The literal lifecycle of one execution trace, from the moment the target system produces it to the moment a diagnosis record reaches storage and the operator.",
   covers:"SDK ingestion → normalization → graph construction → the parallel SED / attribution split → repair generation → controlled replay → persistence → response.",
   design:"A strict left-to-right lifecycle with one explicit fork (Semantic Error Diagnostic runs unconditionally, in parallel with attribution — FR3) and one explicit merge before the diagnosis record is written, mirroring SDS §5."},
  {id:3, title:"Feature-Level Architecture", eyebrow:"Diagram 3 of 9",
   purpose:"Every one of the 10 committed mechanisms, mapped to its trigger, its processing component, what it depends on, and what it outputs — in one scannable table-diagram.",
   covers:"All 10 foundational items (Tier 1 unconditional + Tier 2 gated), plus a compact strip for the 8 gated extensions.",
   design:"Row-per-feature grid grouped by lane color, with a shared-infrastructure column showing which features read/write the same execution-graph and diagnosis-record store — the thing a plain feature list can't show."},
  {id:4, title:"Core Technical / Computational Pipeline", eyebrow:"Diagram 4 of 9",
   purpose:"The one part of the system the whole project is actually measured on: how a diagnosis is hypothesized, grounded in evidence, scored, and then repaired and verified before anyone trusts it.",
   covers:"Culprit Agent + Error Step Localization → Verification Agent → graph-feature confidence → Repair Agent → Verified Automatic Repair's controlled replay → the Tier 2 resume/memory branch.",
   design:"A decision-flow (not a sequence diagram): hypothesis generation, evidence-grounding, and the replay-variance loop are drawn as explicit decision points, with the 0%-API components marked distinctly from the 3 points that do call the LLM."},
  {id:5, title:"Phase-by-Phase Evolution (FYP-1 → FYP-2)", eyebrow:"Diagram 5 of 9",
   purpose:"How the system grows from a proposal-stage spike set to a deployed, evaluated system across two semesters and 5 gates — taken directly from the committed timeline, not re-planned for this diagram.",
   covers:"All 5 evaluation gates, the walking-skeleton milestone, both Tier 2 decision gates, and where each of the 8 extensions actually lands.",
   design:"A horizontal gate-anchored timeline; each gate is a hard vertical line the whole system must cross, with the Minimum Defensible Product for that gate written directly under it, taken from the 06 doc §5.3 table."},
  {id:6, title:"Deployment / Infrastructure Architecture", eyebrow:"Diagram 6 of 9",
   purpose:"Exactly what plan §13 already commits to — one container, one host, one external call — and, just as importantly, what was deliberately left out.",
   covers:"Single Docker container (frontend + backend + Postgres), the LLM API boundary, config/secrets handling, and the SDS §1 exclusion list.",
   design:"A single container boundary with the three internal services inside it, one external arrow out to the LLM API, and a small “explicitly not built” strip — answering the scope-creep question before a panelist asks it."},
  {id:7, title:"Feature Interaction / Operator Workflow", eyebrow:"Diagram 7 of 9",
   purpose:"Not the architecture again — the path a person actually walks: install, wrap a workflow, get a diagnosis, decide whether to trust the fix.",
   covers:"SDK adoption journey (marked PROPOSED — no SDK code exists yet), the confidence-gated human-in-the-loop decision (extension 12), and the Tier 2 resume/remember branch from the operator's point of view.",
   design:"A swimlane between Operator and System: every box the operator actually sees or decides on sits in the top lane; every box that's pure system computation sits below it, so the human-in-the-loop moment is visually unmistakable."},
  {id:8, title:"Integration / External Dependency Architecture", eyebrow:"Diagram 8 of 9",
   purpose:"Every third-party thing Granite touches — what goes in, what comes out, and what happens if it's unavailable — so nothing is a silent single point of failure.",
   covers:"LLM API, CrewAI, LangGraph, Who&amp;When / GSM8K / tau-bench retail, Docker, Postgres, GitHub Actions.",
   design:"One row per dependency: enters / leaves / runtime-critical or offline-only / what happens if it's down — the four questions a panel actually asks about a dependency, answered in a fixed format instead of prose."},
  {id:9, title:"Three-Person Work Division &amp; Responsibility", eyebrow:"Diagram 9 of 9 — mandatory",
   purpose:"Who owns what, across both semesters, in hours — taken directly from the committed effort budget, not re-balanced for this diagram.",
   covers:"All 3 members' primary ownership, the shared band (walking skeleton, Tier 2 gates, UAT, defense prep), FYP-1/FYP-2 split, and the cross-member handoffs.",
   design:"Three swimlanes (one per member) with FYP-1 above FYP-2, a horizontal shared band spanning all three where the plan doc itself records shared ownership, and labelled handoff arrows crossing the lanes at the points the plan doc names."},
];

const NAV_HTML = DIAGRAMS.map(d => `<button class="navitem" data-target="d${d.id}"><span class="navnum">${d.id}</span><span class="navtext">${d.title}</span></button>`).join("");
document.getElementById("navlist").innerHTML = NAV_HTML;

function frame(d, svgHtml, infoExtra){
  return `<section class="view" id="view-d${d.id}">
    <div class="view-eyebrow">${d.eyebrow}</div>
    <h1 class="view-title">${d.title}</h1>
    <p class="view-purpose">${d.purpose}</p>
    <figure>
      ${svgHtml}
      <figcaption>${d.design}</figcaption>
    </figure>
    <div class="infogrid">
      <div class="infocard"><h4>What it covers</h4><p>${d.covers}</p></div>
      ${infoExtra}
    </div>
  </section>`;
}
</script>

}

<script>

const EXTRA = {

  2: `<div class="infocard"><h4>The one real gap</h4><p><span class="badge proposed">GAP</span> <code class="mono">POST /api/runs</code> is the genuine missing piece — today's <code class="mono">poc-demo</code> console is read-only over pre-recorded JSON. Everything left of it in this diagram already runs; everything right of it is proven per-mechanism in isolated spikes, not yet chained live.</p></div>`,
  3: `<div class="infocard"><h4>Why a table, not boxes</h4><p>10 features in a flowchart would either omit detail or overlap arrows illegibly. A row-per-feature grid lets every feature carry the same 5 facts, and the ★/♦ marks do the "shared infrastructure" job a diagram normally needs extra connector lines for.</p></div>`,

  8: `<div class="infocard"><h4>One boundary, two failure classes</h4><p>Runtime-critical rows (LLM API, Postgres) fail the current request if they're down. Offline-only rows (the 3 datasets, Docker, CI) only block future work — a running deployment is unaffected. That distinction is the whole point of the "critical?" column.</p></div>`,
  9: `<div class="infocard"><h4>Where the numbers come from</h4><p>Every hour figure is copied from the committed effort budget (06 doc §5.1), not rebalanced for this diagram — including which lines are solo vs. explicitly joint. The "if removed" line under each name is the guide's own scope test (§5), answered per member.</p></div>`,
};

/* ---------- Assemble all views ---------- */
const SVGS = {1:SVG1,2:SVG2,3:SVG3,4:SVG4,5:SVG5,6:SVG6,7:SVG7,8:SVG8,9:SVG9};
let mainHtml = DIAGRAMS.map(d => frame(d, SVGS[d.id], EXTRA[d.id])).join("\n");

const MATRIX_ROWS = [
  ["1","Complete system map","All 10 foundational mechanisms","Stable across FYP-1 &amp; FYP-2","3 owner lanes, LLM API, operator, target system","What is Granite, structurally, in one picture?"],

  ["4","The technically hard part, as a decision flow","Culprit Agent, Step Localization, Verification Agent, Repair Agent, Verified Automatic Repair, Recovery Controller, Verified Repair Memory","FYP-1 reproduction → FYP-2 closed loop","Strategist/Investigator/Arbiter-equivalent stages, replay engine","How is a diagnosis actually produced and trusted?"],

    <thead><tr><th>#</th><th>Purpose</th><th>Features covered</th><th>Phase(s)</th><th>Main components</th><th>Key question answered</th></tr></thead>
    <tbody>${MATRIX_ROWS.map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join("")}</tbody>
  </table></div>
  <div class="infogrid" style="margin-top:18px">
    <div class="infocard"><h4>Cross-diagram consistency, checked</h4><ul>
      <li>All 10 foundational mechanisms appear in Diagrams 1, 3, 4 and 9 under the same names and Tier badges — no renaming between diagrams.</li>

      <li>Both FYP-1 and FYP-2 are represented in Diagrams 5 and 9, with matching gate names and week ranges.</li>
      <li>The LLM API boundary is drawn identically (dashed, accent color, "core-assist") in Diagrams 1, 2, 6 and 8.</li>
      <li>Every dependency named in Diagram 8 also appears in Diagram 6's deployment view or Diagram 1's system view — nothing is introduced only once.</li>
      <li>No diagram shows Recovery Controller or Verified Repair Memory as already working — every appearance carries the Tier 2 / gated mark.</li>
    </ul></div>
    <div class="infocard"><h4>Not represented, on purpose</h4><p>The 2 explicitly parked items (cross-domain transfer testing, chaos testing) are named once in Diagram 5's scope-band panel and nowhere else — they are Future-band, not part of the built system, so giving them their own boxes elsewhere would overstate their status.</p></div>
  </div>
</section>`;

const GAPS = [
  ["decision","Tier 2 gate outcomes","Recovery Controller's checkpoint PoC and Verified Repair Memory's stronger-backbone re-test have not run yet (plan §7.2, R21/R22) — Diagrams 1, 2, 4 and 9 all show both branches (gate passes / recorded fallback) because the real outcome is a Mid-1 decision, not a proposal-stage fact."],
  ["proposed","SDK adapter hook signatures","The exact per-step interface each framework adapter must emit is named as owed in SDS §14 — Diagram 7's Install/Wrap steps are marked PROPOSED for this reason, not because the design direction is undecided."],
  ["decision","Data-retention window","R16's threat model commits to time-bounded retention as a mechanism; no specific number of days/hours has been chosen (SDS §14). Not shown as a value anywhere in this atlas."],
  ["proposed","Confidence-gate threshold (ext. 12)","The specific score that separates \"auto-suggested\" from \"needs human review\" in Diagram 4 and 7 is a design commitment, not yet a calibrated number — it depends on the confidence-calibration work (ext. 4, FYP-2)."],
  ["decision","Cloud VM vs. on-prem deployment host","Plan §13 names both as acceptable targets and asks the team to state and justify the specific choice at proposal stage — Diagram 6 draws the container generically because the specific host is still open."],
  ["decision","Third architecture (extension 2)","OpenAI Agents SDK vs. a fully custom framework — named as an open choice in plan §0.07 (\"most likely to change\"). Diagram 5 shows the slot; it does not name a framework."],

  <div class="gapslist">
    ${GAPS.map(g=>`<div class="gapitem"><span class="tag ${g[0]}">${g[0]==='proposed'?'PROPOSED':'DECISION'}</span><span><strong style="color:var(--text)">${g[1]}.</strong> ${g[2]}</span></div>`).join("")}
  </div>
</section>`;

document.getElementById("main").innerHTML = mainHtml + matrixHtml + gapsHtml;

/* ---------- Router ---------- */
function activate(id){
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.querySelectorAll(".navitem").forEach(n => n.classList.remove("active"));
  const view = document.getElementById("view-" + id);
  if(view) view.classList.add("active");
  const nav = document.querySelector(`.navitem[data-target="${id}"]`);
  if(nav) nav.classList.add("active");
  window.scrollTo(0,0);
}
document.querySelectorAll(".navitem").forEach(btn => {
  btn.addEventListener("click", () => activate(btn.getAttribute("data-target")));
});
activate("d1");
</script>
