 job has finished]</text></g><g class="edge" data-from="analyst" data-to="ui"><title>Run workflow (task, fault)</title><path d="M95.0 132.0 L270.0 132.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#run-sequence-arrow)"/></g><g class="edge" data-from="ui" data-to="api"><title>POST /api/runs</title><path d="M273.0 174.0 L448.0 174.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#run-sequence-arrow)"/></g><g class="edge" data-from="api" data-to="api"><title>validate task; choose live or recorded</title><path d="M451.0 216.0 L486.0 216.0 Q495.0 216.0 495.0 225.0 L495.0 227.0 Q495.0 236.0 486.0 236.0 L454.0 236.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#run-sequence-arrow)"/></g><g class="edge" data-from="api" data-to="db"><title>insert run (queued)</title><path d="M451.0 264.0 L626.0 264.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#run-sequence-arrow)"/></g><g class="edge" data-from="api" data-to="jobs"><title>submit(run job)</title><path d="M451.0 306.0 L804.0 306.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#run-sequence-arrow)"/></g><g class="edge" data-from="api" data-to="ui"><title>202 run_id, job_id</title><path d="M451.0 348.0 L276.0 348.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#run-sequence-open)"/></g><g class="edge" data-from="jobs" data-to="svc"><title>run_job(run_id)</title><path d="M807.0 390.0 L982.0 390.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#run-sequence-arrow)"/></g><g class="edge" data-from="svc" data-to="core"><title>run_workflow(...)</title><path d="M985.0 432.0 L1160.0 432.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#run-sequence-arrow)"/></g><g class="edge" data-from="core" data-to="model"><title>complete(request)</title><path d="M1163.0 474.0 L1338.0 474.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#run-sequence-arrow)"