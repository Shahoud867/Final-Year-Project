<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1650" width="1180" height="1650" role="img" aria-labelledby="investigation-flow-t investigation-flow-d" data-diagram="investigation-flow"><title id="investigation-flow-t">Investigation flow</title><desc id="investigation-flow-d">Flowchart of one investigation from the submitted task to the report, with every decision point.</desc><style>text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;} .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;} .node:focus{outline:none;} .node:focus > :first-child, .node:focus > rect{stroke-width:2.6;}</style><defs><marker id="investigation-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b8696"/></marker><marker id="investigation-flow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7b8696" stroke-width="1.6"/></marker><marker id="investigation-flow-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="investigation-flow-diamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#7b8696"/></marker><marker id="investigation-flow-odiamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="investigation-flow-many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M2 6 L12 1 M2 6 L12 11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="investigation-flow-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M7 1 V11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="investigation-flow-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#7b8696"/></marker></defs><rect width="1180" height="1650" fill="#ffffff"/><g class="edge" data-from="start" data-to="validate"><path d="M590.0 84.0 L590.0 124.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="validate" data-to="d-valid"><path d="M590.0 180.0 L590.0 220.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-valid" data-to="run"><path d="M590.0 294.0 L590.0 334.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-valid" data-to="rejected-input"><title>no</title><path d="M460.0 257.0 L340.0 257.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="run" data-to="d-run"><path d="M590.0 390.0 L590.0 430.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-run" data-to="checks"><path d="M590.0 504.0 L590.0 544.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-run" data-to="explicit"><title>no</title><path d="M720.0 467.0 L860.0 467.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="checks" data-to="d-fail"><path d="M590.0 600.0 L590.0 640.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-fail" data-to="finding"><path d="M590.0 714.0 L590.0 754.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-fail" data-to="clean"><title>no</title><path d="M460.0 677.0 L340.0 677.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="finding" data-to="rank"><path d="M590.0 810.0 L590.0 850.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="explicit" data-to="rank"><path d="M949.9 492.0 L949.9 859.0 Q949.9 868.0 940.9 868.0 L750.0 868.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="rank" data-to="d-repair"><path d="M590.0 906.0 L590.0 946.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-repair" data-to="replay"><path d="M590.0 1020.0 L590.0 1060.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-repair" data-to="supported"><title>no</title><path d="M460.0 983.0 L340.0 983.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="replay" data-to="d-verdict"><path d="M590.0 1116.0 L590.0 1156.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-verdict" data-to="review"><path d="M590.0 1230.0 L590.0 1270.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-verdict" data-to="next"><title>refuted · inconclusive · error</title><path d="M720.0 1193.0 L900.0 1193.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="next" data-to="rank"><path d="M1090.0 1168.0 L1090.0 901.0 Q1090.0 892.0 1081.0 892.0 L750.0 892.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="supported" data-to="review"><path d="M200.0 1008.0 L200.0 1289.0 Q200.0 1298.0 209.0 1298.0 L430.0 1298.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="review" data-to="d-accept"><path d="M590.0 1326.0 L590.0 1366.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-accept" data-to="resolve"><path d="M590.0 1440.0 L590.0 1480.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="d-accept" data-to="rejected"><title>no</title><path d="M460.0 1403.0 L340.0 1403.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="edge" data-from="resolve" data-to="report"><path d="M590.0 1536.0 L590.0 1576.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#investigation-flow-arrow)"/></g><g class="node" data-id="start" tabindex="0"><rect x="410" y="40" width="360" height="44" rx="22.0" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.4"/><text x="590.0" y="67.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Analyst submits a task (optionally with a fault)</text></g><g class="node" data-id="validate" tabindex="0"><rect x="430" y="124" width="320" height="56" rx="7" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><text x="590.0" y="149.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Validate the task input</text><text x="590.0" y="165.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">message, e-mail, order id; no unknown keys</text></g><g class="node" data-id="d-valid" tabindex="0"><path d="M590.0 220 L720 257.0 L590.0 294 L460 257.0 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="590.0" y="262.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Input valid?</text></g><g class="node" data-id="rejected-input" tabindex="0"><rect x="60" y="232" width="280" height="50" rx="7" fill="#fde7e4" stroke="#c0392b" stroke-width="1.4"/><text x="200.0" y="254.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Refused with field errors</text><text x="200.0" y="270.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">HTTP 422; nothing is stored</text></g><g class="node" data-id="run" tabindex="0"><rect x="430" y="334" width="320" height="56" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="590.0" y="359.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Run the five workflow steps</text><text x="590.0" y="375.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">record inputs, outputs and declared reads</text></g><g class="node" data-id="d-run" tabindex="0"><path d="M590.0 430 L720 467.0 L590.0 504 L460 467.0 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="590.0" y="472.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Run completed?</text></g><g class="node" data-id="explicit" tabindex="0"><rect x="860" y="442" width="290" height="50" rx="7" fill="#fde7e4" stroke="#c0392b" stroke-width="1.4"/><text x="1005.0" y="464.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Open finding: explicit error</text><text x="1005.0" y="480.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">the run stopped at a step</text></g><g class="node" data-id="checks" tabindex="0"><rect x="430" y="544" width="320" height="56" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="590.0" y="569.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Evaluate the checks</text><text x="590.0" y="585.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">2 outcome checks, 5 step contracts</text></g><g class="node" data-id="d-fail" tabindex="0"><path d="M590.0 640 L720 677.0 L590.0 714 L460 677.0 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="590.0" y="682.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Outcome check failed?</text></g><g class="node" data-id="clean" tabindex="0"><rect x="60" y="652" width="280" height="50" rx="7" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.4"/><text x="200.0" y="674.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Clean run: no finding</text><text x="200.0" y="690.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">nothing to investigate</text></g><g class="node" data-id="finding" tabindex="0"><rect x="430" y="754" width="320" height="56" rx="7" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.4"/><text x="590.0" y="779.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Open finding: silent failure</text><text x="590.0" y="795.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">detected, not yet explained · level V0</text></g><g class="node" data-id="rank" tabindex="0"><rect x="430" y="850" width="320" height="56" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="590.0" y="875.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Rank where it began</text><text x="590.0" y="891.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">provenance first, structure as fallback · V1</text></g><g class="node" data-id="d-repair" tabindex="0"><path d="M590.0 946 L720 983.0 L590.0 1020 L460 983.0 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="590.0" y="988.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Replay defined for the step?</text></g><g class="node" data-id="supported" tabindex="0"><rect x="60" y="958" width="280" height="50" rx="7" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.4"/><text x="200.0" y="980.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Evidence-supported</text><text x="200.0" y="996.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">no automatic replay; judge the evidence</text></g><g class="node" data-id="replay" tabindex="0"><rect x="430" y="1060" width="320" height="56" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="590.0" y="1085.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Replay N times with the fix, M without</text><text x="590.0" y="1101.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">controls show it was the fix, not luck</text></g><g class="node" data-id="d-verdict" tabindex="0"><path d="M590.0 1156 L720 1193.0 L590.0 1230 L460 1193.0 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="590.0" y="1198.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Origin confirmed?</text></g><g class="node" data-id="next" tabindex="0"><rect x="900" y="1168" width="250" height="50" rx="7" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="1025.0" y="1190.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Try the next hypothesis</text><text x="1025.0" y="1206.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">or run more replays</text></g><g class="node" data-id="review" tabindex="0"><rect x="430" y="1270" width="320" height="56" rx="7" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.4"/><text x="590.0" y="1295.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Human review</text><text x="590.0" y="1311.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">accept · reject · ask for more information</text></g><g class="node" data-id="d-accept" tabindex="0"><path d="M590.0 1366 L720 1403.0 L590.0 1440 L460 1403.0 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="590.0" y="1408.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Accepted?</text></g><g class="node" data-id="rejected" tabindex="0"><rect x="60" y="1378" width="280" height="50" rx="7" fill="#fde7e4" stroke="#c0392b" stroke-width="1.4"/><text x="200.0" y="1400.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Rejected: closed with a reason</text><text x="200.0" y="1416.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">comment is mandatory</text></g><g class="node" data-id="resolve" tabindex="0"><rect x="430" y="1480" width="320" height="56" rx="7" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.4"/><text x="590.0" y="1505.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Resolve, or close without fixing</text><text x="590.0" y="1521.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">confirmed by a person · level V3</text></g><g class="node" data-id="report" tabindex="0"><rect x="410" y="1576" width="360" height="44" rx="22.0" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.4"/><text x="590.0" y="1603.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Report with hashed evidence (Markdown, JSON)</text></g><text x="600.0" y="318.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">yes</text><text x="400.0" y="250.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">no</text><text x="600.0" y="528.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">yes</text><text x="790.0" y="460.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">no</text><text x="600.0" y="738.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">yes</text><text x="400.0" y="670.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">no</text><text x="600.0" y="1044.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">yes</text><text x="400.0" y="976.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">no</text><text x="600.0" y="1254.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">confirmed · V2</text><text x="810.0" y="1186.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">refuted · inconclusive · error</text><text x="600.0" y="1464.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">yes</text><text x="400.0" y="1396.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">no</text><g class="legend"><rect x="860" y="40" width="266" height="144" rx="7" fill="#ffffff" stroke="#c9d0d9" stroke-width="1"/><text x="872.0" y="58.0" text-anchor="start" style="font-size:11.5px;font-weight:700;fill:#1b2430;">Legend</text><rect x="872" y="65" width="22" height="13" rx="3" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.2"/><text x="904.0" y="76.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">application step</text><rect x="872" y="84" width="22" height="13" rx="3" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.2"/><text x="904.0" y="95.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">granite_core step</text><rect x="872" y="103" width="22" height="13" rx="3" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.2"/><text x="904.0" y="114.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">person</text><rect x="872" y="122" width="22" height="13" rx="3" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.2"/><text x="904.0" y="133.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">open question</text><rect x="872" y="141" width="22" height="13" rx="3" fill="#fde7e4" stroke="#c0392b" stroke-width="1.2"/><text x="904.0" y="152.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">failure outcome</text><rect x="872" y="160" width="22" height="13" rx="3" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.2"/><text x="904.0" y="171.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">good outcome</text></g></svg>
