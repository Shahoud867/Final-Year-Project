<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="vr1-decision-t vr1-decision-d" data-diagram="vr1-decision"><title id="vr1-decision-t">Verdict rule VR-1</title><desc id="vr1-decision-d">The fixed rule that turns replay results into a verdict, with every outcome for N=5, M=2.</desc><style>text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;} .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;} .node:focus{outline:none;} .node:focus > :first-child, .node:focus > rect{stroke-width:2.6;}</style><defs><marker id="vr1-decision-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b8696"/></marker><marker id="vr1-decision-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7b8696" stroke-width="1.6"/></marker><marker id="vr1-decision-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="vr1-decision-diamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#7b8696"/></marker><marker id="vr1-decision-odiamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="vr1-decision-many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M2 6 L12 1 M2 6 L12 11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="vr1-decision-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M7 1 V11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="vr1-decision-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#7b8696"/></marker></defs><rect width="1280" height="600" fill="#ffffff"/><rect x="176.0" y="110.0" width="304.0" height="300.0" fill="#fdf0d0" stroke="#a86a00" stroke-width="1"/><rect x="100.0" y="110.0" width="76.0" height="300.0" fill="#fde7e4" stroke="#c0392b" stroke-width="1"/><rect x="404.0" y="350.0" width="76.0" height="60.0" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1"/><path d="M100 110 V410 H480" fill="none" stroke="#1b2430" stroke-width="1.4"/><path d="M100.0 410 v6" stroke="#1b2430" stroke-width="1.2"/><path d="M176.0 410 v6" stroke="#1b2430" stroke-width="1.2"/><path d="M252.0 410 v6" stroke="#1b2430" stroke-width="1.2"/><path d="M328.0 410 v6" stroke="#1b2430" stroke-width="1.2"/><path d="M404.0 410 v6" stroke="#1b2430" stroke-width="1.2"/><path d="M480.0 410 v6" stroke="#1b2430" stroke-width="1.2"/><path d="M100 410.0 h-6" stroke="#1b2430" stroke-width="1.2"/><path d="M100 260.0 h-6" stroke="#1b2430" stroke-width="1.2"/><path d="M100 110.0 h-6" stroke="#1b2430" stroke-width="1.2"/><circle cx="100.0" cy="410.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"><title>k=0 of 5, c=0 of 2: refuted</title></circle><circle cx="100.0" cy="260.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"><title>k=0 of 5, c=1 of 2: refuted</title></circle><circle cx="100.0" cy="110.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"><title>k=0 of 5, c=2 of 2: refuted</title></circle><circle cx="176.0" cy="410.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"><title>k=1 of 5, c=0 of 2: refuted</title></circle><circle cx="176.0" cy="260.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"><title>k=1 of 5, c=1 of 2: refuted</title></circle><circle cx="176.0" cy="110.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"><title>k=1 of 5, c=2 of 2: refuted</title></circle><circle cx="252.0" cy="410.0" r="5.5" fill="#a86a00" stroke="#ffffff" stroke-width="1.5"><title>k=2 of 5, c=0 of 2: inconclusive</title></circle><circle cx="252.0" cy="260.0" r="5.5" fill="#a86a00" stroke="#ffffff" stroke-width="1.5"><title>k=2 of 5, c=1 of 2: inconclusive</title></circle><circle cx="252.0" cy="110.0" r="5.5" fill="#a86a00" stroke="#ffffff" stroke-width="1.5"><title>k=2 of 5, c=2 of 2: inconclusive</title></circle><circle cx="328.0" cy="410.0" r="5.5" fill="#a86a00" stroke="#ffffff" stroke-width="1.5"><title>k=3 of 5, c=0 of 2: inconclusive</title></circle><circle cx="328.0" cy="260.0" r="5.5" fill="#a86a00" stroke="#ffffff" stroke-width="1.5"><title>k=3 of 5, c=1 of 2: inconclusive</title></circle><circle cx="328.0" cy="110.0" r="5.5" fill="#a86a00" stroke="#ffffff" stroke-width="1.5"><title>k=3 of 5, c=2 of 2: inconclusive</title></circle><circle cx="404.0" cy="410.0" r="5.5" fill="#1d7a46" stroke="#ffffff" stroke-width="1.5"><title>k=4 of 5, c=0 of 2: confirmed</title></circle><circle cx="404.0" cy="260.0" r="5.5" fill="#a86a00" stroke="#ffffff" stroke-width="1.5"><title>k=4 of 5, c=1 of 2: inconclusive</title></circle><circle cx="404.0" cy="110.0" r="5.5" fill="#a86a00" stroke="#ffffff" stroke-width="1.5"><title>k=4 of 5, c=2 of 2: inconclusive</title></circle><circle cx="480.0" cy="410.0" r="5.5" fill="#1d7a46" stroke="#ffffff" stroke-width="1.5"><title>k=5 of 5, c=0 of 2: confirmed</title></circle><circle cx="480.0" cy="260.0" r="5.5" fill="#a86a00" stroke="#ffffff" stroke-width="1.5"><title>k=5 of 5, c=1 of 2: inconclusive</title></circle><circle cx="480.0" cy="110.0" r="5.5" fill="#a86a00" stroke="#ffffff" stroke-width="1.5"><title>k=5 of 5, c=2 of 2: inconclusive</title></circle><rect x="760" y="436" width="70" height="22" rx="4" fill="#fde7e4" stroke="#c0392b" stroke-width="1"/><rect x="834" y="436" width="70" height="22" rx="4" fill="#fde7e4" stroke="#c0392b" stroke-width="1"/><rect x="908" y="436" width="70" height="22" rx="4" fill="#fdf0d0" stroke="#a86a00" stroke-width="1"/><rect x="982" y="436" width="70" height="22" rx="4" fill="#fdf0d0" stroke="#a86a00" stroke-width="1"/><rect x="1056" y="436" width="70" height="22" rx="4" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1"/><rect x="1130" y="436" width="70" height="22" rx="4" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1"/><rect x="760" y="462" width="70" height="22" rx="4" fill="#fde7e4" stroke="#c0392b" stroke-width="1"/><rect x="834" y="462" width="70" height="22" rx="4" fill="#fde7e4" stroke="#c0392b" stroke-width="1"/><rect x="908" y="462" width="70" height="22" rx="4" fill="#fdf0d0" stroke="#a86a00" stroke-width="1"/><rect x="982" y="462" width="70" height="22" rx="4" fill="#fdf0d0" stroke="#a86a00" stroke-width="1"/><rect x="1056" y="462" width="70" height="22" rx="4" fill="#fdf0d0" stroke="#a86a00" stroke-width="1"/><rect x="1130" y="462" width="70" height="22" rx="4" fill="#fdf0d0" stroke="#a86a00" stroke-width="1"/><rect x="760" y="488" width="70" height="22" rx="4" fill="#fde7e4" stroke="#c0392b" stroke-width="1"/><rect x="834" y="488" width="70" height="22" rx="4" fill="#fde7e4" stroke="#c0392b" stroke-width="1"/><rect x="908" y="488" width="70" height="22" rx="4" fill="#fdf0d0" stroke="#a86a00" stroke-width="1"/><rect x="982" y="488" width="70" height="22" rx="4" fill="#fdf0d0" stroke="#a86a00" stroke-width="1"/><rect x="1056" y="488" width="70" height="22" rx="4" fill="#fdf0d0" stroke="#a86a00" stroke-width="1"/><rect x="1130" y="488" width="70" height="22" rx="4" fill="#fdf0d0" stroke="#a86a00" stroke-width="1"/><g class="edge" data-from="r1" data-to="r2"><path d="M669.6 114.0 L669.6 140.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#vr1-decision-arrow)"/></g><g class="edge" data-from="r2" data-to="r3"><path d="M669.6 194.0 L669.6 220.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#vr1-decision-arrow)"/></g><g class="edge" data-from="r3" data-to="r4"><path d="M669.6 274.0 L669.6 300.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#vr1-decision-arrow)"/></g><g class="node" data-id="r1" tabindex="0"><rect x="620" y="60" width="620" height="54" rx="7" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="930.0" y="84.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">1   Did every replay and every control finish?</text><text x="930.0" y="100.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">no: ERROR, no verdict is given; the finding returns to &#x27;hypothesized&#x27;</text></g><g class="node" data-id="r2" tabindex="0"><rect x="620" y="140" width="620" height="54" rx="7" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.4"/><text x="930.0" y="164.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">2   k/N ≥ 0.8  and  c/M ≤ 0.2 ?</text><text x="930.0" y="180.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">yes: CONFIRMED, the fix (not luck) changed the outcome</text></g><g class="node" data-id="r3" tabindex="0"><rect x="620" y="220" width="620" height="54" rx="7" fill="#fde7e4" stroke="#c0392b" stroke-width="1.4"/><text x="930.0" y="244.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">3   k/N ≤ 0.2 ?</text><text x="930.0" y="260.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">yes: REFUTED, fixing this step changes nothing, so it is not the origin</text></g><g class="node" data-id="r4" tabindex="0"><rect x="620" y="300" width="620" height="54" rx="7" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.4"/><text x="930.0" y="324.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">4   otherwise</text><text x="930.0" y="340.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">INCONCLUSIVE: run more replays, or review with a written reason</text></g><g class="note"><path d="M100 500 H558 L570 512 V589 H100 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.1"/><path d="M558 500 V512 H570" fill="none" stroke="#7b8696" stroke-width="1.1"/><text x="110.0" y="518.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">What counts as a pass, and how sure we are</text><text x="110.0" y="533.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">A replay passes only if every originally failing target check now</text><text x="110.0" y="548.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">passes and no check that passed before has stopped passing.</text><text x="110.0" y="563.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">Wilson 95% interval for k/N: 5 of 5 gives 57% to 100%; 0 of 5 gives 0% to 43%.</text><text x="110.0" y="578.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">With five replays the interval is wide, and the report says so.</text></g><g class="note"><path d="M620 530 H1228 L1240 542 V574 H620 Z" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.1"/><path d="M1228 530 V542 H1240" fill="none" stroke="#a86a00" stroke-width="1.1"/><text x="630.0" y="548.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Limits</text><text x="630.0" y="563.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">N is at most 10 and M at most 5. A changed threshold is a new rule version (VR-2), never an edit of VR-1.</text></g><text x="100.0" y="430.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">0.0</text><text x="176.0" y="430.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">0.2</text><text x="252.0" y="430.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">0.4</text><text x="328.0" y="430.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">0.6</text><text x="404.0" y="430.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">0.8</text><text x="480.0" y="430.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">1.0</text><text x="90.0" y="414.0" text-anchor="end" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">0.0</text><text x="90.0" y="264.0" text-anchor="end" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">0.5</text><text x="90.0" y="114.0" text-anchor="end" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">1.0</text><text x="290.0" y="452.0" text-anchor="middle" style="font-size:11.5px;font-weight:500;fill:#1b2430;" class="halo">share of replays that pass with the fix  (k / N)</text><text x="56.0" y="96.0" text-anchor="start" style="font-size:11.5px;font-weight:500;fill:#1b2430;" class="halo">share of controls that pass  (c / M)</text><text x="138.0" y="230.0" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#c0392b;" class="halo">REFUTED</text><text x="309.0" y="224.0" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#a86a00;" class="halo">INCONCLUSIVE</text><text x="490.0" y="384.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1d7a46;" class="halo">CONFIRMED</text><text x="100.0" y="476.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">Dots: every possible outcome for N = 5 replays and M = 2 controls, coloured by decide().</text><text x="620.0" y="400.0" text-anchor="start" style="font-size:11.5px;font-weight:700;fill:#1b2430;" class="halo">decide(k, 5, c, 2) for every k and c:</text><text x="797.0" y="428.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">k = 0</text><text x="871.0" y="428.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">k = 1</text><text x="945.0" y="428.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">k = 2</text><text x="1019.0" y="428.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">k = 3</text><text x="1093.0" y="428.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">k = 4</text><text x="1167.0" y="428.0" text-anchor="middle" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">k = 5</text><text x="750.0" y="453.0" text-anchor="end" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">c = 0</text><text x="795.0" y="451.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">refuted</text><text x="869.0" y="451.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">refuted</text><text x="943.0" y="451.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">inconclusive</text><text x="1017.0" y="451.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">inconclusive</text><text x="1091.0" y="451.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">confirmed</text><text x="1165.0" y="451.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">confirmed</text><text x="750.0" y="479.0" text-anchor="end" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">c = 1</text><text x="795.0" y="477.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">refuted</text><text x="869.0" y="477.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">refuted</text><text x="943.0" y="477.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">inconclusive</text><text x="1017.0" y="477.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">inconclusive</text><text x="1091.0" y="477.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">inconclusive</text><text x="1165.0" y="477.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">inconclusive</text><text x="750.0" y="505.0" text-anchor="end" style="font-size:10.5px;font-weight:500;fill:#586474;" class="halo">c = 2</text><text x="795.0" y="503.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">refuted</text><text x="869.0" y="503.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">refuted</text><text x="943.0" y="503.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">inconclusive</text><text x="1017.0" y="503.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">inconclusive</text><text x="1091.0" y="503.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">inconclusive</text><text x="1165.0" y="503.0" text-anchor="middle" style="font-size:9.8px;font-weight:600;fill:#1b2430;" class="halo">inconclusive</text></svg>
