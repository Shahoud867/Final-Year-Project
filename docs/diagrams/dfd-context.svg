<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" role="img" aria-labelledby="dfd-context-t dfd-context-d" data-diagram="dfd-context"><title id="dfd-context-t">Data flow diagram: context (level 0)</title><desc id="dfd-context-d">Granite as one process, with everything that crosses its boundary.</desc><style>text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;} .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;} .node:focus{outline:none;} .node:focus > :first-child, .node:focus > rect{stroke-width:2.6;}</style><defs><marker id="dfd-context-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b8696"/></marker><marker id="dfd-context-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7b8696" stroke-width="1.6"/></marker><marker id="dfd-context-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="dfd-context-diamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#7b8696"/></marker><marker id="dfd-context-odiamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="dfd-context-many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M2 6 L12 1 M2 6 L12 11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="dfd-context-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M7 1 V11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="dfd-context-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#7b8696"/></marker></defs><rect width="1240" height="400" fill="#ffffff"/><g class="edge" data-from="analyst" data-to="granite"><path d="M230.0 190.0 L504.0 190.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#dfd-context-arrow)"/></g><g class="edge" data-from="granite" data-to="analyst"><path d="M506.0 236.0 L230.0 236.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#dfd-context-arrow)"/></g><g class="edge" data-from="granite" data-to="llm"><title>prompts (messages, seed)</title><path d="M680.0 140.0 L1010.0 140.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#dfd-context-arrow)"/></g><g class="edge" data-from="llm" data-to="granite"><title>completions</title><path d="M1010.0 172.0 L726.0 172.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#dfd-context-arrow)"/></g><g class="edge" data-from="retail" data-to="granite"><title>orders, catalogue prices (source of truth)</title><path d="M1010.0 267.0 L709.0 267.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#dfd-context-arrow)"/></g><g class="node" data-id="analyst" tabindex="0"><rect x="40" y="170" width="190" height="80" rx="7" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.4"/><text x="135.0" y="207.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Analyst</text><text x="135.0" y="223.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">developer, QA or reviewer</text></g><g class="node" data-id="granite" tabindex="0"><ellipse cx="620.0" cy="210.0" rx="120.0" ry="80.0" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="620.0" y="207.5" text-anchor="middle" style="font-size:14px;font-weight:650;fill:#1b2430;">0   Granite</text><text x="620.0" y="223.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">investigation workbench</text></g><g class="node" data-id="llm" tabindex="0"><rect x="1010" y="120" width="200" height="70" rx="7" fill="#eef1f5" stroke="#66717f" stroke-width="1.4"/><text x="1110.0" y="152.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Language model</text><text x="1110.0" y="168.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Ollama or hosted endpoint</text></g><g class="node" data-id="retail" tabindex="0"><rect x="1010" y="232" width="200" height="70" rx="7" fill="#eef1f5" stroke="#66717f" stroke-width="1.4"/><text x="1110.0" y="264.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Retail data</text><text x="1110.0" y="280.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">orders, customers, catalogue</text></g><g class="note"><path d="M40 300 H448 L460 312 V359 H40 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.1"/><path d="M448 300 V312 H460" fill="none" stroke="#7b8696" stroke-width="1.1"/><text x="50.0" y="318.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Boundary</text><text x="50.0" y="333.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">In recorded mode the language model is replaced by a file of saved</text><text x="50.0" y="348.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">answers; nothing else about the flows changes.</text></g><text x="367.0" y="168.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">task, fault choice,</text><text x="367.0" y="183.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">verify request, review decision</text><text x="367.0" y="252.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">run trace, check results, findings,</text><text x="367.0" y="267.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">ranked hypotheses, verdicts, evidence, report</text><text x="845.0" y="133.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">prompts (messages, seed)</text><text x="868.0" y="187.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">completions</text><text x="859.5" y="260.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">orders, catalogue prices (source of truth)</text></svg>
