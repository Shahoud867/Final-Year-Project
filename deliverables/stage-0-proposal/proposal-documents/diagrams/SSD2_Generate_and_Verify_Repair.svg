<svg viewBox="0 0 1100 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="System sequence diagram: the Operator requests a repair, Granite calls the external LLM API to generate a candidate and to replay it under a controlled protocol, computes a recovery rate, and branches three ways: resume from a verified checkpoint if the Tier 2 Recovery Controller gate passed, resume via replay as the Tier 1 fallback, or route to human review if the recovery rate is below threshold.">
  <title>SSD-2 — Generate and Verify a Repair</title>
  <defs>
    <marker id="n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#211c12"/></marker>
    <marker id="n1r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8" fill="none" stroke="#211c12" stroke-width="1.6"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="900" fill="#faf6ef"/>
  <text x="30" y="34" font-size="19" font-weight="800" fill="#211c12">SSD-2 — Generate and Verify a Repair</text>
  <text x="30" y="54" font-size="12" fill="#5c5440">Covers UC-6, UC-7, UC-8 (Tier 2), UC-9 (Tier 2), UC-10 · FR-4.1–4.6 · the two genuinely API-dependent stages (plan §6)</text>

  <!-- Lifelines -->
  <rect x="40" y="80" width="170" height="44" rx="8" fill="#ffffff" stroke="#5c5440" stroke-width="1.8"/>
  <text x="125" y="107" font-size="13.5" font-weight="700" fill="#211c12" text-anchor="middle">:Operator</text>
  <line x1="125" y1="124" x2="125" y2="840" stroke="#5c5440" stroke-width="1.6" stroke-dasharray="6,4"/>

  <rect x="460" y="80" width="220" height="44" rx="8" fill="#fff7ea" stroke="#a96a1f" stroke-width="2"/>
  <text x="570" y="107" font-size="13.5" font-weight="700" fill="#a96a1f" text-anchor="middle">:Granite (system boundary)</text>
  <line x1="570" y1="124" x2="570" y2="840" stroke="#a96a1f" stroke-width="1.6" stroke-dasharray="6,4"/>

  <rect x="900" y="80" width="160" height="44" rx="8" fill="#eef3fa" stroke="#2f5f9e" stroke-width="1.8"/>
  <text x="980" y="107" font-size="13.5" font-weight="700" fill="#2f5f9e" text-anchor="middle">:LLM API</text>
  <line x1="980" y1="124" x2="980" y2="840" stroke="#2f5f9e" stroke-width="1.6" stroke-dasharray="6,4"/>

  <rect x="563" y="155" width="14" height="640" fill="#f4efe5" stroke="#a96a1f" stroke-width="1.4"/>

  <!-- 1 requestRepair -->
  <line x1="125" y1="160" x2="563" y2="160" stroke="#211c12" stroke-width="1.8" marker-end="url(#n1)"/>
  <text x="345" y="152" font-size="12.5" font-weight="600" fill="#211c12" text-anchor="middle">1: requestRepair(runId)</text>

  <!-- 2 generateCandidate -->
  <line x1="577" y1="195" x2="900" y2="195" stroke="#211c12" stroke-width="1.8" marker-end="url(#n1)"/>
  <text x="740" y="187" font-size="12" font-weight="600" fill="#211c12" text-anchor="middle">2: generateCandidate(context) — UC-6</text>
  <line x1="900" y1="220" x2="577" y2="220" stroke="#2f5f9e" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#n1r)"/>
  <text x="740" y="212" font-size="12" fill="#2f5f9e" text-anchor="middle">3: candidateFix</text>

  <!-- extend note: memory reuse -->
  <text x="595" y="245" font-size="10.5" fill="#93701a">«extend» UC-9 (Tier 2): if a stored pattern matches and the VRM gate passed, candidate is retrieved from memory, skipping 2–3</text>

  <!-- 4 replay -->
  <line x1="577" y1="280" x2="900" y2="280" stroke="#211c12" stroke-width="1.8" marker-end="url(#n1)"/>
  <text x="740" y="272" font-size="12" font-weight="600" fill="#211c12" text-anchor="middle">4: replay(candidateFix, N=5, pinnedDecodingParams) — UC-7</text>
  <line x1="900" y1="305" x2="577" y2="305" stroke="#2f5f9e" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#n1r)"/>
  <text x="740" y="297" font-size="12" fill="#2f5f9e" text-anchor="middle">5: replayResults[N] (frozen upstream context, bit-identical non-LLM steps)</text>

  <!-- 6 computeRecoveryRate self -->
  <rect x="577" y="325" width="12" height="30" fill="#f4efe5" stroke="#a96a1f" stroke-width="1.2"/>
  <path d="M577,332 h55 v14 h-55" fill="none" stroke="#5c5440" stroke-width="1.4" marker-end="url(#n1)"/>
  <text x="650" y="327" font-size="11.5" fill="#5c5440">6: computeRecoveryRate(replayResults) — R25</text>

  <!-- ALT frame, 3 branches -->
  <rect x="60" y="375" width="990" height="420" fill="none" stroke="#b5601f" stroke-width="1.6"/>
  <path d="M60,375 h70 v18 l-12,12 h-58 z" fill="#fff2e2" stroke="#b5601f" stroke-width="1.6"/>
  <text x="70" y="389" font-size="11" font-weight="700" fill="#b5601f">alt</text>
  <text x="140" y="389" font-size="11" fill="#b5601f">[recovery_success = true AND Recovery Controller gate passed — TIER 2]</text>

  <rect x="577" y="430" width="12" height="26" fill="#f4efe5" stroke="#a96a1f" stroke-width="1.2"/>
  <path d="M577,436 h55 v14 h-55" fill="none" stroke="#5c5440" stroke-width="1.4" marker-end="url(#n1)"/>
  <text x="650" y="431" font-size="11.5" fill="#5c5440">resumeFromCheckpoint() — UC-8</text>
  <line x1="563" y1="465" x2="125" y2="465" stroke="#2f7a4f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#n1r)"/>
  <text x="345" y="457" font-size="11.5" fill="#2f7a4f" text-anchor="middle">resumed(diagnosisRecord, mechanism=&quot;checkpoint&quot;)</text>

  <line x1="70" y1="495" x2="1040" y2="495" stroke="#b5601f" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="140" y="511" font-size="11" fill="#b5601f">[recovery_success = true AND Recovery Controller gate FAILED — recorded fallback]</text>
  <rect x="577" y="525" width="12" height="26" fill="#f4efe5" stroke="#a96a1f" stroke-width="1.2"/>
  <path d="M577,531 h55 v14 h-55" fill="none" stroke="#5c5440" stroke-width="1.4" marker-end="url(#n1)"/>
  <text x="650" y="526" font-size="11.5" fill="#5c5440">resumeViaControlledReplay() — Tier 1, already delivered by step 4</text>
  <line x1="563" y1="560" x2="125" y2="560" stroke="#2f7a4f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#n1r)"/>
  <text x="345" y="552" font-size="11.5" fill="#2f7a4f" text-anchor="middle">resumed(diagnosisRecord, mechanism=&quot;replay&quot;)</text>

  <line x1="70" y1="590" x2="1040" y2="590" stroke="#b5601f" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="140" y="606" font-size="11" fill="#b5601f">[recovery_rate below confidence threshold — needs human review, ext #12 / UC-10]</text>
  <line x1="563" y1="630" x2="125" y2="630" stroke="#93701a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#n1r)"/>
  <text x="345" y="622" font-size="11.5" fill="#93701a" text-anchor="middle">needsHumanReview(candidateFix, recoveryRate, confidence)</text>
  <line x1="125" y1="665" x2="563" y2="665" stroke="#211c12" stroke-width="1.8" marker-end="url(#n1)"/>
  <text x="345" y="657" font-size="11.5" font-weight="600" fill="#211c12" text-anchor="middle">approve(candidateFix)  |  reject(candidateFix)</text>
  <line x1="563" y1="700" x2="125" y2="700" stroke="#2f7a4f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#n1r)"/>
  <text x="345" y="692" font-size="11.5" fill="#2f7a4f" text-anchor="middle">repairOutcome(applied | rejected)</text>

  <text x="140" y="775" font-size="10.5" fill="#a6392f" font-style="italic">opt [LLM API unavailable at step 2 or 4]: Granite → Operator: error(code=LLM_UNAVAILABLE) — NFR-6.1, degraded state not a crash</text>

  <text x="30" y="845" font-size="11.5" fill="#5c5440">Legend:  →  synchronous call    ⇢  return / response    ▭ activation bar    [ ] alt condition</text>
  <text x="30" y="865" font-size="11.5" fill="#8c8368">Note: steps 2 and 4 are the only calls to the external LLM API in Granite's entire repair path — every branching decision after step 6 is Granite's own logic, 0% API.</text>
</svg>
