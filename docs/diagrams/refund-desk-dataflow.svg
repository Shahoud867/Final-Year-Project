<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1530 580" width="1530" height="580" role="img" aria-labelledby="refund-desk-dataflow-t refund-desk-dataflow-d" data-diagram="refund-desk-dataflow"><title id="refund-desk-dataflow-t">Lineage graph of the Refund Desk</title><desc id="refund-desk-dataflow-d">Which step reads which field of which earlier step: the graph attribution walks backwards.</desc><style>text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;} .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;} .node:focus{outline:none;} .node:focus > :first-child, .node:focus > rect{stroke-width:2.6;}</style><defs><marker id="refund-desk-dataflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b8696"/></marker><marker id="refund-desk-dataflow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7b8696" stroke-width="1.6"/></marker><marker id="refund-desk-dataflow-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="refund-desk-dataflow-diamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#7b8696"/></marker><marker id="refund-desk-dataflow-odiamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="refund-desk-dataflow-many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M2 6 L12 1 M2 6 L12 11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="refund-desk-dataflow-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M7 1 V11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="refund-desk-dataflow-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#7b8696"/></marker></defs><rect width="1530" height="580" fill="#ffffff"/><g class="edge" data-from="s1" data-to="s2"><title>order_id</title><path d="M472.0 278.0 L564.0 278.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#refund-desk-dataflow-arrow)"/></g><g class="edge" data-from="s2" data-to="s3"><title>status, user_id, items, payment_method</title><path d="M734.0 278.0 L826.0 278.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#refund-desk-dataflow-arrow)"/></g><g class="edge" data-from="s3" data-to="s4"><title>items_to_refund</title><path d="M996.0 278.0 L1088.0 278.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#refund-desk-dataflow-arrow)"/></g><g class="edge" data-from="s4" data-to="s5"><title>refund_amount</title><path d="M1258.0 278.0 L1350.0 278.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#refund-desk-dataflow-arrow)"/></g><g class="edge" data-from="task" data-to="s1"><title>message</title><path d="M210.0 278.0 L302.0 278.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#refund-desk-dataflow-arrow)"/></g><g class="edge" data-from="s1" data-to="s3"><title>item_names</title><path d="M424.4 230.0 L424.4 179.0 Q424.4 170.0 433.4 170.0 L864.6 170.0 Q873.6 170.0 873.6 179.0 L873.6 230.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#refund-desk-dataflow-arrow)"/></g><g class="edge" data-from="s3" data-to="s5"><title>refund_method, eligible, reason</title><path d="M948.4 326.0 L948.4 377.0 Q948.4 386.0 957.4 386.0 L1388.6 386.0 Q1397.6 386.0 1397.6 377.0 L1397.6 326.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#refund-desk-dataflow-arrow)"/></g><g class="edge" data-from="task" data-to="s3"><title>email</title><path d="M162.4 230.0 L162.4 133.0 Q162.4 124.0 171.4 124.0 L864.6 124.0 Q873.6 124.0 873.6 133.0 L873.6 230.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#refund-desk-dataflow-arrow)"/></g><g class="edge" data-from="fault" data-to="s2"><path d="M649.0 460.0 L649.0 326.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#refund-desk-dataflow-arrow)"/></g><g class="node" data-id="task" tabindex="0"><rect x="40" y="230" width="170" height="96" rx="7" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.4"/><text x="125.0" y="268.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Task input</text><text x="125.0" y="284.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">message, e-mail,</text><text x="125.0" y="299.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">order id</text></g><g class="node" data-id="s1" tabindex="0"><title>reads: task.message</title><rect x="302" y="230" width="170" height="96" rx="7" fill="#fdf2d9" stroke="#b0731a" stroke-width="1.4"/><text x="387.0" y="260.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">s1  Intake</text><text x="387.0" y="276.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">llm step</text><text x="387.0" y="291.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">CT-INTAKE</text><text x="387.0" y="306.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">replay defined</text></g><g class="node" data-id="s2" tabindex="0"><title>reads: s1.order_id</title><rect x="564" y="230" width="170" height="96" rx="7" fill="#fde7e4" stroke="#c0392b" stroke-width="1.4"/><text x="649.0" y="260.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">s2  Order Lookup</text><text x="649.0" y="276.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">tool step</text><text x="649.0" y="291.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">CT-LOOKUP</text><text x="649.0" y="306.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">replay defined</text></g><g class="node" data-id="s3" tabindex="0"><title>reads: s2.status, s2.user_id, s2.items, s2.payment_method, s1.item_names, task.email</title><rect x="826" y="230" width="170" height="96" rx="7" fill="#fdf2d9" stroke="#b0731a" stroke-width="1.4"/><text x="911.0" y="260.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">s3  Policy</text><text x="911.0" y="276.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">code step</text><text x="911.0" y="291.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">CHK-OUT-2</text><text x="911.0" y="306.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">CT-POLICY</text></g><g class="node" data-id="s4" tabindex="0"><title>reads: s3.items_to_refund</title><rect x="1088" y="230" width="170" height="96" rx="7" fill="#fdf2d9" stroke="#b0731a" stroke-width="1.4"/><text x="1173.0" y="260.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">s4  Refund Calculator</text><text x="1173.0" y="276.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">llm step</text><text x="1173.0" y="291.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">CT-CALC</text><text x="1173.0" y="306.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">replay defined</text></g><g class="node" data-id="s5" tabindex="0"><title>reads: s4.refund_amount, s3.refund_method, s3.eligible, s3.reason</title><rect x="1350" y="230" width="170" height="96" rx="7" fill="#fdf2d9" stroke="#b0731a" stroke-width="1.4"/><text x="1435.0" y="260.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">s5  Writer</text><text x="1435.0" y="276.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">llm step</text><text x="1435.0" y="291.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">CHK-OUT-1</text><text x="1435.0" y="306.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">CT-WRITER</text></g><g class="note"><path d="M524 460 H762 L774 472 V534 H524 Z" fill="#fde7e4" stroke="#c0392b" stroke-width="1.1"/><path d="M762 460 V472 H774" fill="none" stroke="#c0392b" stroke-width="1.1"/><text x="534.0" y="478.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Where the fault enters</text><text x="534.0" y="493.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">stale_price changes s2.items[i].price</text><text x="534.0" y="508.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">by 0.25 with no error; every later</text><text x="534.0" y="523.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">step then works correctly on a wrong value.</text></g><g class="note"><path d="M1100 460 H1478 L1490 472 V534 H1100 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.1"/><path d="M1478 460 V472 H1490" fill="none" stroke="#7b8696" stroke-width="1.1"/><text x="1110.0" y="478.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Why this graph matters</text><text x="1110.0" y="493.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">A wrong amount in s5&#x27;s message is followed backwards along</text><text x="1110.0" y="508.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">these edges. A step whose own check failed against the source</text><text x="1110.0" y="523.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">of truth is the best origin candidate (weight 1.0).</text></g><text x="518.0" y="270.0" text-anchor="middle" style="font-size:10.2px;font-weight:500;fill:#586474;" class="halo">order_id</text><text x="780.0" y="241.0" text-anchor="middle" style="font-size:10.2px;font-weight:500;fill:#586474;" class="halo">status,</text><text x="780.0" y="255.5" text-anchor="middle" style="font-size:10.2px;font-weight:500;fill:#586474;" class="halo">user_id, items,</text><text x="780.0" y="270.0" text-anchor="middle" style="font-size:10.2px;font-weight:500;fill:#586474;" class="halo">payment_method</text><text x="1042.0" y="270.0" text-anchor="middle" style="font-size:10.2px;font-weight:500;fill:#586474;" class="halo">items_to_refund</text><text x="1304.0" y="270.0" text-anchor="middle" style="font-size:10.2px;font-weight:500;fill:#586474;" class="halo">refund_amount</text><text x="256.0" y="270.0" text-anchor="middle" style="font-size:10.2px;font-weight:500;fill:#586474;" class="halo">message</text><text x="649.0" y="164.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">item_names</text><text x="1173.0" y="380.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">refund_method, eligible, reason</text><text x="518.0" y="118.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">email</text></svg>
