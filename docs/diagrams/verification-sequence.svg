;fill:#586474;" class="halo">17  decide (VR-1), Wilson interval</text><text x="1074.0" y="858.0" text-anchor="middle" style="font-size:11px;font-weight:500;fill:#586474;" class="halo">18  summary, replays</text><text x="807.0" y="900.0" text-anchor="middle" style="font-size:11px;font-weight:500;fill:#586474;" class="halo">19  verdict, evidence, finding status</text><text x="362.0" y="942.0" text-anchor="middle" style="font-size:11px;font-weight:500;fill:#586474;" class="halo">20  GET /api/findings/{id}</text><text x="362.0" y="984.0" text-anchor="middle" style="font-size:11px;font-weight:500;fill:#586474;" class="halo">21  status, verdict, evidence</text><text x="184.0" y="1026.0" text-anchor="middle" style="font-size:11px;font-weight:500;fill:#586474;" class="halo">22  verdict card</text></svg>
