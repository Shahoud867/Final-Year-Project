utcome (computed)</text><g class="legend"><rect x="900" y="430" width="416" height="68" rx="7" fill="#ffffff" stroke="#c9d0d9" stroke-width="1"/><text x="912.0" y="448.0" text-anchor="start" style="font-size:11.5px;font-weight:700;fill:#1b2430;">Step treatment</text><rect x="912" y="455" width="22" height="13" rx="3" fill="#eef1f5" stroke="#66717f" stroke-width="1.2"/><text x="944.0" y="466.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">copied from the stored trace</text><rect x="912" y="474" width="22" height="13" rx="3" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.2"/><text x="944.0" y="485.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">executed again</text><rect x="1112" y="455" width="22" height="13" rx="3" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.2"/><text x="1144.0" y="466.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">copied and patched</text><rect x="1112" y="474" width="22" height="13" rx="3" fill="#fde7e4" stroke="#c0392b" stroke-width="1.2"/><text x="1144.0" y="485.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">carries the wrong value</text></g></svg>
