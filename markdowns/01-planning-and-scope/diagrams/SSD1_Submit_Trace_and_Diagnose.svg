<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="System sequence diagram: the Operator submits an execution trace to the Granite system, which builds the execution graph, attributes the failure and detects silent failures in parallel with zero external API calls, then returns the diagnosis; malformed-trace and no-failure alternative flows are shown.">
  <title>SSD-1 — Submit Trace and Receive Diagnosis</title>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#211c12"/></marker>
    <marker id="m1r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8" fill="none" stroke="#211c12" stroke-width="1.6"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="760" fill="#faf6ef"/>
  <text x="30" y="34" font-size="19" font-weight="800" fill="#211c12">SSD-1 — Submit Trace and Receive Diagnosis</text>
  <text x="30" y="54" font-size="12" fill="#5c5440">Covers UC-3, UC-4, UC-5 · FR-2, FR-3, FR-5.2 · zero LLM API calls on this path (plan §6)</text>

  <!-- Lifelines -->
  <rect x="60" y="80" width="190" height="44" rx="8" fill="#ffffff" stroke="#5c5440" stroke-width="1.8"/>
  <text x="155" y="107" font-size="14" font-weight="700" fill="#211c12" text-anchor="middle">:Operator</text>
  <line x1="155" y1="124" x2="155" y2="700" stroke="#5c5440" stroke-width="1.6" stroke-dasharray="6,4"/>

  <rect x="700" y="80" width="220" height="44" rx="8" fill="#fff7ea" stroke="#a96a1f" stroke-width="2"/>
  <text x="810" y="107" font-size="14" font-weight="700" fill="#a96a1f" text-anchor="middle">:Granite (system boundary)</text>
  <line x1="810" y1="124" x2="810" y2="700" stroke="#a96a1f" stroke-width="1.6" stroke-dasharray="6,4"/>

  <!-- Activation bar on Granite -->
  <rect x="803" y="160" width="14" height="500" fill="#f4efe5" stroke="#a96a1f" stroke-width="1.4"/>

  <!-- 1. submitTrace -->
  <line x1="155" y1="160" x2="803" y2="160" stroke="#211c12" stroke-width="1.8" marker-end="url(#m1)"/>
  <text x="470" y="152" font-size="12.5" fill="#211c12" text-anchor="middle" font-weight="600">1: submitTrace(rawTrace)</text>

  <!-- 2. buildExecutionGraph (self) -->
  <rect x="817" y="190" width="12" height="34" fill="#f4efe5" stroke="#a96a1f" stroke-width="1.2"/>
  <path d="M817,196 h55 v14 h-55" fill="none" stroke="#5c5440" stroke-width="1.4" marker-end="url(#m1)"/>
  <text x="890" y="185" font-size="11.5" fill="#5c5440">2: buildExecutionGraph()</text>
  <text x="890" y="200" font-size="10" fill="#8c8368">structural parsing, 0% API</text>

  <!-- 3. ack -->
  <line x1="803" y1="250" x2="155" y2="250" stroke="#5c5440" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#m1r)"/>
  <text x="470" y="242" font-size="12" fill="#5c5440" text-anchor="middle">3: ack(runId, status=&quot;traced&quot;)</text>

  <!-- 4/5 parallel attribution + SED -->
  <rect x="817" y="285" width="12" height="90" fill="#f4efe5" stroke="#a96a1f" stroke-width="1.2"/>
  <path d="M817,300 h60 v14 h-60" fill="none" stroke="#5c5440" stroke-width="1.4" marker-end="url(#m1)"/>
  <text x="895" y="295" font-size="11.5" fill="#5c5440">4: attributeFailure()</text>
  <text x="895" y="310" font-size="10" fill="#8c8368">Culprit Agent + Step + Verification — 0% API</text>

  <path d="M817,345 h60 v14 h-60" fill="none" stroke="#5c5440" stroke-width="1.4" marker-end="url(#m1)"/>
  <text x="895" y="340" font-size="11.5" fill="#5c5440">5: detectSilentFailure()</text>
  <text x="895" y="355" font-size="10" fill="#8c8368">Semantic Error Diagnostic — runs UNCONDITIONALLY (FR-3.2), 0% API</text>
  <text x="895" y="368" font-size="10" fill="#93701a">in parallel with step 4, not gated on its output</text>

  <!-- 6. diagnosisReady -->
  <line x1="803" y1="400" x2="155" y2="400" stroke="#5c5440" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#m1r)"/>
  <text x="470" y="392" font-size="12" fill="#5c5440" text-anchor="middle">6: diagnosisReady(culpritAgent, step, confidence, sedVerdict, coverageFlag)</text>

  <!-- ALT frame: malformed trace -->
  <rect x="120" y="440" width="750" height="120" fill="none" stroke="#b5601f" stroke-width="1.6"/>
  <path d="M120,440 h70 v18 l-12,12 h-58 z" fill="#fff2e2" stroke="#b5601f" stroke-width="1.6"/>
  <text x="130" y="454" font-size="11" font-weight="700" fill="#b5601f">alt</text>
  <text x="200" y="454" font-size="11" fill="#b5601f">[trace is malformed — missing fields / unparseable structure]</text>
  <line x1="803" y1="480" x2="155" y2="480" stroke="#a6392f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#m1r)"/>
  <text x="470" y="472" font-size="12" fill="#a6392f" text-anchor="middle">error(code=MALFORMED_TRACE) — NFR-6.2</text>

  <line x1="130" y1="500" x2="870" y2="500" stroke="#b5601f" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="200" y="516" font-size="11" fill="#b5601f">[trace is well-formed but no fault is present — clean control]</text>
  <line x1="803" y1="540" x2="155" y2="540" stroke="#2f7a4f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#m1r)"/>
  <text x="470" y="532" font-size="12" fill="#2f7a4f" text-anchor="middle">diagnosisReady(status=&quot;clean_no_fault&quot;) — FR-1.3 clean-control path</text>

  <!-- 7. persist -->
  <rect x="817" y="585" width="12" height="30" fill="#f4efe5" stroke="#a96a1f" stroke-width="1.2"/>
  <path d="M817,592 h55 v14 h-55" fill="none" stroke="#5c5440" stroke-width="1.4" marker-end="url(#m1)"/>
  <text x="890" y="587" font-size="11.5" fill="#5c5440">7: persistDiagnosisRecord()</text>

  <text x="30" y="655" font-size="11.5" fill="#5c5440">Legend:  →  synchronous call    ⇢  return / response    ▭ activation bar    [ ] alt condition</text>
  <text x="30" y="675" font-size="11.5" fill="#8c8368">Note: every message on this SSD is served with zero calls to the external LLM API — the diagnosis path is the 0%-API side of Granite's 15–20% budget (plan §6).</text>
</svg>
