<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520" role="img" aria-labelledby="check-pipeline-t check-pipeline-d" data-diagram="check-pipeline"><title id="check-pipeline-t">Check language: from text to result</title><desc id="check-pipeline-d">How a check expression is validated once and then evaluated safely on any trace.</desc><style>text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;} .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;} .node:focus{outline:none;} .node:focus > :first-child, .node:focus > rect{stroke-width:2.6;}</style><defs><marker id="check-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b8696"/></marker><marker id="check-pipeline-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7b8696" stroke-width="1.6"/></marker><marker id="check-pipeline-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="check-pipeline-diamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#7b8696"/></marker><marker id="check-pipeline-odiamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="check-pipeline-many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M2 6 L12 1 M2 6 L12 11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="check-pipeline-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M7 1 V11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="check-pipeline-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#7b8696"/></marker></defs><rect width="1440" height="520" fill="#ffffff"/><g class="edge" data-from="src" data-to="parse"><path d="M220.0 145.0 L270.0 145.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#check-pipeline-arrow)"/></g><g class="edge" data-from="parse" data-to="validate"><path d="M440.0 145.0 L490.0 145.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#check-pipeline-arrow)"/></g><g class="edge" data-from="validate" data-to="expr"><path d="M710.0 145.0 L760.0 145.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#check-pipeline-arrow)"/></g><g class="edge" data-from="expr" data-to="eval"><path d="M930.0 145.0 L980.0 145.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#check-pipeline-arrow)"/></g><g class="edge" data-from="eval" data-to="res"><path d="M1180.0 145.0 L1230.0 145.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#check-pipeline-arrow)"/></g><g class="edge" data-from="validate" data-to="rejected"><path d="M600.0 180.0 L600.0 250.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#check-pipeline-arrow)"/></g><g class="edge" data-from="eval" data-to="o-PASS"><path d="M1080.0 180.0 L1080.0 213.0 Q1080.0 222.0 1071.0 222.0 L908.0 222.0 Q899.0 222.0 899.0 231.0 L899.0 250.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#check-pipeline-arrow)"/></g><g class="edge" data-from="eval" data-to="o-FAIL"><path d="M1080.0 180.0 L1080.0 213.0 Q1080.0 222.0 1071.0 222.0 L1058.0 222.0 Q1049.0 222.0 1049.0 231.0 L1049.0 250.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#check-pipeline-arrow)"/></g><g class="edge" data-from="eval" data-to="o-ABSTAIN"><path d="M1080.0 180.0 L1080.0 213.0 Q1080.0 222.0 1089.0 222.0 L1190.0 222.0 Q1199.0 222.0 1199.0 231.0 L1199.0 250.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#check-pipeline-arrow)"/></g><g class="edge" data-from="eval" data-to="o-ERROR"><path d="M1080.0 180.0 L1080.0 213.0 Q1080.0 222.0 1089.0 222.0 L1340.0 222.0 Q1349.0 222.0 1349.0 231.0 L1349.0 250.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#check-pipeline-arrow)"/></g><g class="node" data-id="src" tabindex="0"><rect x="30" y="110" width="190" height="70" rx="7" fill="#fdf2d9" stroke="#b0731a" stroke-width="1.4"/><text x="125.0" y="135.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Check expression</text><text x="125.0" y="151.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">plain text, written</text><text x="125.0" y="166.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">by a workflow author</text></g><g class="node" data-id="parse" tabindex="0"><rect x="270" y="110" width="170" height="70" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="355.0" y="135.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Parse</text><text x="355.0" y="151.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">ast.parse, mode &#x27;eval&#x27;</text><text x="355.0" y="166.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">(never executed)</text></g><g class="node" data-id="validate" tabindex="0"><rect x="490" y="110" width="220" height="70" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="600.0" y="135.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Validate against whitelist</text><text x="600.0" y="151.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">node types, names, limits;</text><text x="600.0" y="166.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">anything else is refused</text></g><g class="node" data-id="expr" tabindex="0"><rect x="760" y="110" width="170" height="70" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="845.0" y="135.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Expression</text><text x="845.0" y="151.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">compiled once,</text><text x="845.0" y="166.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">lists its references</text></g><g class="node" data-id="eval" tabindex="0"><rect x="980" y="110" width="200" height="70" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="1080.0" y="135.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Evaluate on a trace</text><text x="1080.0" y="151.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">context: task + step outputs</text><text x="1080.0" y="166.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">truth functions, tolerance</text></g><g class="node" data-id="res" tabindex="0"><rect x="1230" y="110" width="180" height="70" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="1320.0" y="135.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">CheckResult</text><text x="1320.0" y="151.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">status, observed, expected,</text><text x="1320.0" y="166.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">computation (for evidence)</text></g><g class="node" data-id="rejected" tabindex="0"><rect x="490" y="250" width="220" height="56" rx="7" fill="#fde7e4" stroke="#c0392b" stroke-width="1.4"/><text x="600.0" y="275.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Refused when the check is saved</text><text x="600.0" y="291.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">DSLSyntaxError names the construct</text></g><g class="node" data-id="o-PASS" tabindex="0"><rect x="830" y="250" width="138" height="56" rx="7" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.4"/><text x="899.0" y="275.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">PASS</text><text x="899.0" y="291.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">expression is true</text></g><g class="node" data-id="o-FAIL" tabindex="0"><rect x="980" y="250" width="138" height="56" rx="7" fill="#fde7e4" stroke="#c0392b" stroke-width="1.4"/><text x="1049.0" y="275.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">FAIL</text><text x="1049.0" y="291.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">expression is false</text></g><g class="node" data-id="o-ABSTAIN" tabindex="0"><rect x="1130" y="250" width="138" height="56" rx="7" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.4"/><text x="1199.0" y="275.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">ABSTAIN</text><text x="1199.0" y="291.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">a field is missing</text></g><g class="node" data-id="o-ERROR" tabindex="0"><rect x="1280" y="250" width="138" height="56" rx="7" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="1349.0" y="275.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">ERROR</text><text x="1349.0" y="291.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">it cannot be evaluated</text></g><g class="note"><path d="M30 250 H438 L450 262 V369 H30 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.1"/><path d="M438 250 V262 H450" fill="none" stroke="#7b8696" stroke-width="1.1"/><text x="40.0" y="268.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Limits (from granite_core.dsl)</text><text x="40.0" y="283.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">source at most 500 characters, 150 syntax nodes,</text><text x="40.0" y="298.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">nesting depth 14; strings up to 200 characters</text><text x="40.0" y="313.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">Allowed: arithmetic, comparison, and/or/not,</text><text x="40.0" y="328.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">field paths such as s3.items_to_refund, and the functions</text><text x="40.0" y="343.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">abs, all, any, approx, contains, len, max, min, number_in, plu</text><text x="40.0" y="358.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">ck, round, sum, truth.&lt;name&gt;()</text></g><g class="note"><path d="M30 400 H818 L830 412 V474 H30 Z" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.1"/><path d="M818 400 V412 H830" fill="none" stroke="#a86a00" stroke-width="1.1"/><text x="40.0" y="418.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Why not eval()</text><text x="40.0" y="433.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">A check is text typed by a user and run on data the system did not write. Python&#x27;s eval would let it read files or run</text><text x="40.0" y="448.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">commands. Here the text is only parsed; a small interpreter walks the tree and understands nothing but the whitelist.</text><text x="40.0" y="463.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">25 hostile expressions (attribute access, imports, lambdas, comprehensions, f-strings, **) are rejected in the tests.</text></g><g class="note"><path d="M870 400 H1398 L1410 412 V459 H870 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.1"/><path d="M1398 400 V412 H1410" fill="none" stroke="#7b8696" stroke-width="1.1"/><text x="880.0" y="418.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">A missing field is not a pass</text><text x="880.0" y="433.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">If a step did not produce the field a check needs, the result is ABSTAIN,</text><text x="880.0" y="448.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">so an incomplete run can never look correct (requirement FR-CHK-03).</text></g><text x="30.0" y="60.0" text-anchor="start" style="font-size:11.5px;font-weight:700;fill:#1b2430;" class="halo">Example (CHK-OUT-1):</text><text x="150.0" y="60.0" text-anchor="start" style="font-size:11px;font-weight:500;fill:#1b2430;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;" class="halo">approx(number_in(s5.message), truth.catalog_total(pluck(s3.items_to_refund, &#x27;item_id&#x27;)))</text></svg>
