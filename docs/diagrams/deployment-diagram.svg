145.0 320.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#deployment-diagram-arrow)"/></g><g class="edge" data-from="uvicorn" data-to="ollama"><path d="M345.0 264.0 L345.0 320.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#deployment-diagram-arrow)"/></g><g class="edge" data-from="laptop" data-to="repo"><title>git push</title><path d="M460.0 127.0 L530.0 127.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#deployment-diagram-arrow)"/></g><g class="edge" data-from="repo" data-to="ci"><path d="M715.0 154.0 L715.0 200.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#deployment-diagram-arrow)"/></g><g class="edge" data-from="ci" data-to="image"><path d="M715.0 292.0 L715.0 340.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#deployment-diagram-arrow)"/></g><g class="edge" data-from="image" data-to="container"><path d="M900.0 372.0 L941.0 372.0 Q950.0 372.0 950.0 363.0 L950.0 241.0 Q950.0 232.0 959.0 232.0 L1000.0 232.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#deployment-diagram-arrow)"/></g><g class="edge" data-from="visitor" data-to="container"><path d="M1180.0 154.0 L1180.0 200.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#deployment-diagram-arrow)"/></g><g class="edge" data-from="container" data-to="tmpdisk"><path d="M1085.0 264.0 L1085.0 320.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#deployment-diagram-arrow)"/></g><g class="node" data-id="browser" tabindex="0"><rect x="60" y="100" width="170" height="54" rx="7" fill="#f0eafc" stroke="#6f4fc7" stroke-width="1.4"/><text x="145.0" y="124.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Browser</text><text x="145.0" y="140.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">the built React UI</text></g><g class="node" data-id="uvicorn" tabindex="0"><rect x="60" y="200" width="370" height="64" rx="7" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><text x="245.0" y="222.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">«process» uvicorn: granite_api</text><text x="245.0" y="238.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">port 8000 · serves /api and the web bundle</text><text x="245.0" y="253.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">started from apps/api (setup manual, section 3)</text></g><g class="node" data-id="sqlite" tabindex="0"><path d="M60 327 A85.0 7 0 0 1 230 327 V387 A85.0 7 0 0 1 60 387 Z" fill="#f4f6f9" stroke="#55606e" stroke-width="1.4"/><path d="M60 327 A85.0 7 0 0 0 230 327" fill="none" stroke="#55606e" stroke-width="1.4"/><text x="145.0" y="354.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">SQLite file</text><text x="145.0" y="370.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">apps/api/.granite/</text><text x="145.0" y="385.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">granite.db</text></g><g class="node" data-id="ollama" tabindex="0"><rect x="260" y="320" width="170" height="66" rx="7" fill="#eef1f5" stroke="#66717f" stroke-width="1.4"/><text x="345.0" y="343.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">«process» Ollama</text><text x="345.0" y="359.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">optional · port 11434</text><text x="345.0" y="374.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">llama3.2:3b, live mode</text></g><g class="node" data-id="repo" tabindex="0"><rect x="530" y="100" width="370" height="54" rx="7" fill="#f4f6f9" stroke="#55606e" stroke-width="1.4"/><text x="715.0" y="124.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Repository</text><text x="715.0" y="140.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Shahoud867/Final-Year-Project · branch main</text></g><g class="node" data-id="ci" tabindex="0"><rect x="530" y="200" width="370" height="92" rx="7" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><text x="715.0" y="228.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">«pipeline» GitHub Actions: CI</text><text x="715.0" y="244.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Python: lint, types, tests, security scans</text><text x="715.0" y="259.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Web: lint, types, tests, build · secret scan</text><text x="715.0" y="274.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Container: build image, smoke test inside it</text></g><g class="node" data-id="image" tabindex="0"><rect x="530" y="340" width="370" height="64" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="715.0" y="362.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">«artifact» Container image</text><text x="715.0" y="378.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Dockerfile: API + built UI + recorded answers</text><text x="715.0" y="393.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">runs as a non-root user, health check</text></g><g class="node" data-id="visitor" tabindex="0"><rect x="1000" y="100" width="360" height="54" rx="7" fill="#ffffff" stroke="#9aa4b1" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1180.0" y="124.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Supervisor&#x27;s browser</text><text x="1180.0" y="140.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">public URL over HTTPS</text></g><g class="node" data-id="container" tabindex="0"><rect x="1000" y="200" width="360" height="64" rx="7" fill="#ffffff" stroke="#9aa4b1" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1180.0" y="222.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">«container» granite-demo</text><text x="1180.0" y="238.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">recorded mode · port 8000 · /api/health</text><text x="1180.0" y="253.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">defined in render.yaml</text></g><g class="node" data-id="tmpdisk" tabindex="0"><path d="M1000 327 A85.0 7 0 0 1 1170 327 V387 A85.0 7 0 0 1 1000 387 Z" fill="#ffffff" stroke="#9aa4b1" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M1000 327 A85.0 7 0 0 0 1170 327" fill="none" stroke="#9aa4b1" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1085.0" y="354.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Temporary disk</text><text x="1085.0" y="370.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">SQLite; resets on</text><text x="1085.0" y="385.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">restart or deploy</text></g><g class="note"><path d="M720 490 H1378 L1390 502 V564 H720 Z" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.1"/><path d="M1378 490 V502 H1390" fill="none" stroke="#a86a00" stroke-width="1.1"/><text x="730.0" y="508.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Honest status (2026-10-11)</text><text x="730.0" y="523.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">Left and middle are verified: the laptop run was exercised in a browser and by the smoke test, and</text><text x="730.0" y="538.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">CI built the image and ran the smoke test inside it. The right side is only prepared: nobody has</text><text x="730.0" y="553.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">created the Render service, so there is no public URL yet.</text></g><text x="157.0" y="182.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">HTTP :8000</text><text x="157.0" y="296.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">file</text><text x="357.0" y="296.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">HTTP</text><text x="495.0" y="120.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">git push</text><text x="727.0" y="182.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">push or pull request</text><text x="727.0" y="320.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">docker build</text><text x="950.0" y="478.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">deploy from render.yaml: a manual step that has not been done yet</text><text x="1192.0" y="182.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">HTTPS</text><g class="legend"><rect x="30" y="490" width="661" height="68" rx="7" fill="#ffffff" stroke="#c9d0d9" stroke-width="1"/><text x="42.0" y="508.0" text-anchor="start" style="font-size:11.5px;font-weight:700;fill:#1b2430;">Legend</text><rect x="42" y="515" width="22" height="13" rx="3" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.2"/><text x="74.0" y="526.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">running Granite process</text><rect x="42" y="534" width="22" height="13" rx="3" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.2"/><text x="74.0" y="545.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">build artefact</text><rect x="257" y="515" width="22" height="13" rx="3" fill="#f4f6f9" stroke="#55606e" stroke-width="1.2"/><text x="289.0" y="526.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">data at rest</text><rect x="257" y="534" width="22" height="13" rx="3" fill="#eef1f5" stroke="#66717f" stroke-width="1.2"/><text x="289.0" y="545.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">optional service</text><rect x="472" y="515" width="22" height="13" rx="3" fill="#ffffff" stroke="#9aa4b1" stroke-width="1.2" stroke-dasharray="4 3"/><text x="504.0" y="526.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">prepared, not deployed</text><path d="M472 541 H496" stroke="#7b8696" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#deployment-diagram-arrow)"/><text x="504.0" y="545.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">planned connection</text></g></svg>
