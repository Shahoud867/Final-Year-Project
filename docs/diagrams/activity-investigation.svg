fill="#f0eafc" stroke="#6f4fc7" stroke-width="1.4"/><text x="420.0" y="216.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Check the form, send the run</text><text x="420.0" y="232.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">POST /api/runs</text></g><g class="node" data-id="a2" tabindex="0"><rect x="570" y="274" width="260" height="54" rx="7" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><text x="700.0" y="298.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Validate, store run, queue job</text><text x="700.0" y="314.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">answers 202 at once</text></g><g class="node" data-id="a3" tabindex="0"><rect x="870" y="356" width="240" height="54" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="990.0" y="380.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Execute the five steps</text><text x="990.0" y="396.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">run_workflow, record reads</text></g><g class="node" data-id="a4" tabindex="0"><rect x="870" y="438" width="240" height="54" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="990.0" y="462.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Check, detect, rank</text><text x="990.0" y="478.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">evaluate_checks, attribute</text></g><g class="node" data-id="a5" tabindex="0"><rect x="570" y="520" width="260" height="54" rx="7" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><text x="700.0" y="544.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Store trace, results, finding,</text><text x="700.0" y="560.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">hypotheses and evidence</text></g><g class="node" data-id="a6" tabindex="0"><rect x="310" y="602" width="220" height="54" rx="7" fill="#f0eafc" stroke="#6f4fc7" stroke-width="1.4"/><text x="420.0" y="626.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Show graph, checks, finding</text><text x="420.0" y="642.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">poll the job, load the run</text></g><g class="node" data-id="m1" tabindex="0"><rect x="1150" y="356" width="200" height="54" rx="7" fill="#eef1f5" stroke="#66717f" stroke-width="1.4"/><text x="1250.0" y="380.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Answer three prompts</text><text x="1250.0" y="396.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">live, or recorded answers</text></g><g class="node" data-id="q-finding" tabindex="0"><path d="M160.0 678 L260 713.0 L160.0 748 L60 713.0 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="160.0" y="718.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Finding opened?</text></g><g class="node" data-id="clean" tabindex="0"><rect x="310" y="686" width="220" height="54" rx="7" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.4"/><text x="420.0" y="710.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Clean run: nothing to investigate</text><text x="420.0" y="726.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">all outcome checks passed</text></g><g class="node" data-id="end-clean"><circle cx="590.0" cy="713.0" r="9" fill="#fff" stroke="#1b2430" stroke-width="1.5"/><circle cx="590.0" cy="713.0" r="5" fill="#1b2430"/></g><g class="node" data-id="v0" tabindex="0"><rect x="50" y="766" width="220" height="54" rx="7" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.4"/><text x="160.0" y="790.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Press Verify on a hypothesis</text><text x="160.0" y="806.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">choose N replays, M controls</text></g><g class="node" data-id="v1" tabindex="0"><rect x="570" y="848" width="260" height="54" rx="7" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><text x="700.0" y="872.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Check state and repair rule,</text><text x="700.0" y="888.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">queue the experiment</text></g><g class="node" data-id="v2" tabindex="0"><rect x="870" y="930" width="240" height="54" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="990.0" y="954.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Replay N with fix, M without</text><text x="990.0" y="970.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">run_experiment</text></g><g class="node" data-id="v3" tabindex="0"><rect x="870" y="1012" width="240" height="54" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="990.0" y="1036.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Decide by rule VR-1</text><text x="990.0" y="1052.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">counts, Wilson interval</text></g><g class="node" data-id="v4" tabindex="0"><rect x="570" y="1094" width="260" height="54" rx="7" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><text x="700.0" y="1118.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Store replays, verdict,</text><text x="700.0" y="1134.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">evidence, new status</text></g><g class="node" data-id="v5" tabindex="0"><rect x="310" y="1176" width="220" height="54" rx="7" fill="#f0eafc" stroke="#6f4fc7" stroke-width="1.4"/><text x="420.0" y="1200.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Show the verdict and replays</text><text x="420.0" y="1216.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">progress shown while running</text></g><g class="node" data-id="v6" tabindex="0"><rect x="50" y="1258" width="220" height="54" rx="7" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.4"/><text x="160.0" y="1282.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Accept, reject or ask</text><text x="160.0" y="1298.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">the comment rule applies</text></g><g class="node" data-id="v7" tabindex="0"><rect x="570" y="1340" width="260" height="54" rx="7" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><text x="700.0" y="1364.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Record review and audit entry</text><text x="700.0" y="1380.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">apply_review, lifecycle</text></g><g class="node" data-id="v8" tabindex="0"><rect x="310" y="1422" width="220" height="54" rx="7" fill="#f0eafc" stroke="#6f4fc7" stroke-width="1.4"/><text x="420.0" y="1446.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Show status, offer the report</text><text x="420.0" y="1462.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Markdown or JSON</text></g><g class="node" data-id="m2" tabindex="0"><rect x="1150" y="930" width="200" height="54" rx="7" fill="#eef1f5" stroke="#66717f" stroke-width="1.4"/><text x="1250.0" y="954.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Answer replay prompts</text><text x="1250.0" y="970.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">only the re-executed steps</text></g><g class="node" data-id="end"><circle cx="420.0" cy="1516" r="9" fill="#fff" stroke="#1b2430" stroke-width="1.5"/><circle cx="420.0" cy="1516" r="5" fill="#1b2430"/></g><g class="note"><path d="M870 602 H1288 L1300 614 V676 H870 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.1"/><path d="M1288 602 V614 H1300" fill="none" stroke="#7b8696" stroke-width="1.1"/><text x="880.0" y="620.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Two things run without the analyst</text><text x="880.0" y="635.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">Steps in the green and blue lanes happen in a background job;</text><text x="880.0" y="650.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">the UI only polls. The model is reached from granite_core alone,</text><text x="880.0" y="665.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">never from the UI or the routes.</text></g><text x="285.0" y="706.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">no</text><text x="170.0" y="764.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">yes</text></svg>
