<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" role="img" aria-labelledby="use-case-diagram-t use-case-diagram-d" data-diagram="use-case-diagram"><title id="use-case-diagram-t">Use-case diagram (Mid-1 scope)</title><desc id="use-case-diagram-d">What an analyst can do with Granite today, and the use cases planned for later milestones.</desc><style>text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;} .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;} .node:focus{outline:none;} .node:focus > :first-child, .node:focus > rect{stroke-width:2.6;}</style><defs><marker id="use-case-diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b8696"/></marker><marker id="use-case-diagram-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7b8696" stroke-width="1.6"/></marker><marker id="use-case-diagram-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="use-case-diagram-diamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#7b8696"/></marker><marker id="use-case-diagram-odiamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="use-case-diagram-many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M2 6 L12 1 M2 6 L12 11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="use-case-diagram-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M7 1 V11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="use-case-diagram-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#7b8696"/></marker></defs><rect width="1240" height="660" fill="#ffffff"/><g class="frame" data-id="system"><rect x="250" y="50" width="720" height="580" rx="10" fill="#ffffff" fill-opacity="0.45" stroke="#7b8696" stroke-width="1.2"/><text x="262.0" y="69.0" text-anchor="start" style="font-size:12px;font-weight:700;fill:#7b8696;">Granite</text></g><g class="edge" data-from="analyst" data-to="uc03"><path d="M130.0 290.0 L290.0 121.0" fill="none" stroke="#7b8696" stroke-width="1.5"/></g><g class="edge" data-from="analyst" data-to="uc05"><path d="M130.0 290.0 L290.0 211.0" fill="none" stroke="#7b8696" stroke-width="1.5"/></g><g class="edge" data-from="analyst" data-to="uc07"><path d="M130.0 290.0 L290.0 301.0" fill="none" stroke="#7b8696" stroke-width="1.5"/></g><g class="edge" data-from="analyst" data-to="uc08"><path d="M130.0 290.0 L290.0 391.0" fill="none" stroke="#7b8696" stroke-width="1.5"/></g><g class="edge" data-from="analyst" data-to="uc09"><path d="M130.0 290.0 L290.0 481.0" fill="none" stroke="#7b8696" stroke-width="1.5"/></g><g class="edge" data-from="analyst" data-to="uc12"><path d="M130.0 290.0 L290.0 571.0" fill="none" stroke="#7b8696" stroke-width="1.5"/></g><g class="edge" data-from="uc03" data-to="uc06"><title>«include»</title><path d="M590.0 121.0 L650.0 121.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#use-case-diagram-open)"/></g><g class="edge" data-from="uc11" data-to="uc09"><title>«extend»</title><path d="M590.0 481.0 L650.0 481.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#use-case-diagram-open)"/></g><g class="edge" data-from="uc06" data-to="llm"><path d="M940.0 121.0 L1080.0 215.0" fill="none" stroke="#7b8696" stroke-width="1.5"/></g><g class="edge" data-from="uc08" data-to="llm"><path d="M590.0 391.0 L611.0 391.0 Q620.0 391.0 620.0 382.0 L620.0 229.0 Q620.0 220.0 629.0 220.0 L991.0 220.0 Q1000.0 220.0 1009.0 220.6 L1080.0 225.0" fill="none" stroke="#7b8696" stroke-width="1.5"/></g><g class="node" data-id="analyst" tabindex="0"><circle cx="100" cy="259" r="8" fill="#fff" stroke="#1b2430" stroke-width="1.5"/><path d="M100 267 V290 M85 276 H115 M100 290 L88 308 M100 290 L112 308" fill="none" stroke="#1b2430" stroke-width="1.5"/><text x="100.0" y="325.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Analyst</text></g><g class="node" data-id="llm" tabindex="0"><circle cx="1110" cy="189" r="8" fill="#fff" stroke="#1b2430" stroke-width="1.5"/><path d="M1110 197 V220 M1095 206 H1125 M1110 220 L1098 238 M1110 220 L1122 238" fill="none" stroke="#1b2430" stroke-width="1.5"/><text x="1110.0" y="255.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Language model</text></g><g class="node" data-id="uc03" tabindex="0"><rect x="290" y="90" width="300" height="62" rx="31.0" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="440.0" y="118.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">UC-03  Run a workflow task</text><text x="440.0" y="134.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">with an optional injected fault</text></g><g class="node" data-id="uc05" tabindex="0"><rect x="290" y="180" width="300" height="62" rx="31.0" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="440.0" y="208.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">UC-05  Inspect a run</text><text x="440.0" y="224.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">graph, steps, check results</text></g><g class="node" data-id="uc07" tabindex="0"><rect x="290" y="270" width="300" height="62" rx="31.0" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="440.0" y="298.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">UC-07  Investigate a finding</text><text x="440.0" y="314.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">ranked origin hypotheses</text></g><g class="node" data-id="uc08" tabindex="0"><rect x="290" y="360" width="300" height="62" rx="31.0" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="440.0" y="388.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">UC-08  Verify a hypothesis</text><text x="440.0" y="404.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">controlled replay, verdict</text></g><g class="node" data-id="uc09" tabindex="0"><rect x="290" y="450" width="300" height="62" rx="31.0" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="440.0" y="478.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">UC-09  Review a finding</text><text x="440.0" y="494.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">accept, reject, ask for information</text></g><g class="node" data-id="uc12" tabindex="0"><rect x="290" y="540" width="300" height="62" rx="31.0" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="440.0" y="568.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">UC-12  Browse and search history</text><text x="440.0" y="584.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">filters by severity and level</text></g><g class="node" data-id="uc06" tabindex="0"><rect x="650" y="90" width="290" height="62" rx="31.0" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="795.0" y="118.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">UC-06  Analyse the run</text><text x="795.0" y="134.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">checks, findings, hypotheses</text></g><g class="node" data-id="uc11" tabindex="0"><rect x="650" y="450" width="290" height="62" rx="31.0" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="795.0" y="478.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">UC-11  Export a report</text><text x="795.0" y="494.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Markdown and JSON</text></g><g class="node" data-id="later" tabindex="0"><rect x="650" y="250" width="290" height="100" rx="7" fill="#ffffff" stroke="#9aa4b1" stroke-width="1.4" stroke-dasharray="6 4"/><text x="795.0" y="275.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Planned for later milestones</text><text x="795.0" y="291.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">UC-01/02 configure, edit checks</text><text x="795.0" y="306.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">UC-04 import a trace · UC-10 suggest a fix</text><text x="795.0" y="321.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">UC-13/14 benchmark, evaluation</text><text x="795.0" y="336.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">UC-15 SDK · UC-16/17 reuse, administer</text></g><g class="note"><path d="M990 440 H1208 L1220 452 V529 H990 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.1"/><path d="M1208 440 V452 H1220" fill="none" stroke="#7b8696" stroke-width="1.1"/><text x="1000.0" y="458.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Mid-1 scope</text><text x="1000.0" y="473.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">Solid use cases are implemented</text><text x="1000.0" y="488.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">and tested. The reviewer and the</text><text x="1000.0" y="503.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">developer are the same person at</text><text x="1000.0" y="518.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">this stage (no accounts yet).</text></g><text x="620.0" y="114.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">«include»</text><text x="620.0" y="474.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">«extend»</text></svg>
