<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-labelledby="finding-state-machine-t finding-state-machine-d" data-diagram="finding-state-machine"><title id="finding-state-machine-t">Finding state machine</title><desc id="finding-state-machine-d">Every status a finding can have and the only events that may change it.</desc><style>text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;} .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;} .node:focus{outline:none;} .node:focus > :first-child, .node:focus > rect{stroke-width:2.6;}</style><defs><marker id="finding-state-machine-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b8696"/></marker><marker id="finding-state-machine-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7b8696" stroke-width="1.6"/></marker><marker id="finding-state-machine-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="finding-state-machine-diamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#7b8696"/></marker><marker id="finding-state-machine-odiamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="finding-state-machine-many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M2 6 L12 1 M2 6 L12 11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="finding-state-machine-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M7 1 V11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="finding-state-machine-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#7b8696"/></marker></defs><rect width="1600" height="620" fill="#ffffff"/><g class="frame" data-id="review"><rect x="900" y="52" width="190" height="444" rx="10" fill="#ffffff" fill-opacity="0.45" stroke="#7b8696" stroke-width="1.2" stroke-dasharray="6 5"/><text x="912.0" y="71.0" text-anchor="start" style="font-size:12px;font-weight:700;fill:#7b8696;">awaiting review</text></g><g class="edge" data-from="start" data-to="open"><path d="M52.0 275.0 L90.0 275.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="open" data-to="hypothesized"><title>open --hypotheses_ready--&gt; hypothesized</title><path d="M210.0 275.0 L340.0 275.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="hypothesized" data-to="verifying"><title>hypothesized --verify_started--&gt; verifying</title><path d="M490.0 265.0 L640.0 265.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="verifying" data-to="hypothesized"><title>verifying --verify_error--&gt; hypothesized</title><path d="M640.0 287.0 L490.0 287.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="verifying" data-to="inconclusive"><title>verifying --verdict_inconclusive--&gt; inconclusive</title><path d="M770.0 265.0 L920.0 265.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="inconclusive" data-to="verifying"><title>inconclusive --verify_started--&gt; verifying</title><path d="M920.0 287.0 L770.0 287.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="verifying" data-to="confirmed"><title>verifying --verdict_confirmed--&gt; confirmed</title><path d="M705.0 250.0 L705.0 124.0 Q705.0 115.0 714.0 115.0 L920.0 115.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="verifying" data-to="refuted"><title>verifying --verdict_refuted--&gt; refuted</title><path d="M685.0 300.0 L685.0 410.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="refuted" data-to="verifying"><title>refuted --verify_started--&gt; verifying</title><path d="M725.0 410.0 L725.0 300.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="hypothesized" data-to="evidence_supported"><title>hypothesized --evidence_supported--&gt; evidence_supported</title><path d="M415.0 300.0 L415.0 551.0 Q415.0 560.0 424.0 560.0 L986.0 560.0 Q995.0 560.0 995.0 551.0 L995.0 460.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="accepted" data-to="resolved"><title>accepted --resolve--&gt; resolved</title><path d="M1245.0 150.0 L1245.0 124.0 Q1245.0 115.0 1254.0 115.0 L1400.0 115.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="accepted" data-to="wont_fix"><title>accepted --wont_fix--&gt; wont_fix</title><path d="M1310.0 175.0 L1346.0 175.0 Q1355.0 175.0 1355.0 184.0 L1355.0 226.0 Q1355.0 235.0 1364.0 235.0 L1400.0 235.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="review" data-to="accepted"><title>review_accept</title><path d="M1090.0 175.0 L1180.0 175.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="review" data-to="rejected"><title>review_reject</title><path d="M1090.0 395.0 L1180.0 395.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="rejected" data-to="end-rejected"><path d="M1310.0 395.0 L1363.0 395.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="resolved" data-to="end-resolved"><path d="M1520.0 115.0 L1556.0 115.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="edge" data-from="wont_fix" data-to="end-wont_fix"><path d="M1520.0 235.0 L1556.0 235.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#finding-state-machine-arrow)"/></g><g class="node" data-id="open" tabindex="0"><title>FindingStatus.OPEN</title><rect x="90" y="250" width="120" height="50" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="150.0" y="272.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">open</text><text x="150.0" y="288.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">level V0</text></g><g class="node" data-id="hypothesized" tabindex="0"><title>FindingStatus.HYPOTHESIZED</title><rect x="340" y="250" width="150" height="50" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="415.0" y="272.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">hypothesized</text><text x="415.0" y="288.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">level V1</text></g><g class="node" data-id="verifying" tabindex="0"><title>FindingStatus.VERIFYING</title><rect x="640" y="250" width="130" height="50" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="705.0" y="272.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">verifying</text><text x="705.0" y="288.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">level V1</text></g><g class="node" data-id="refuted" tabindex="0"><title>FindingStatus.REFUTED</title><rect x="640" y="410" width="130" height="50" rx="7" fill="#fde7e4" stroke="#c0392b" stroke-width="1.4"/><text x="705.0" y="432.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">refuted</text><text x="705.0" y="448.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">level V1</text></g><g class="node" data-id="confirmed" tabindex="0"><title>FindingStatus.CONFIRMED</title><rect x="920" y="90" width="150" height="50" rx="7" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.4"/><text x="995.0" y="112.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">confirmed</text><text x="995.0" y="128.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">level V2</text></g><g class="node" data-id="inconclusive" tabindex="0"><title>FindingStatus.INCONCLUSIVE</title><rect x="920" y="250" width="150" height="50" rx="7" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.4"/><text x="995.0" y="272.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">inconclusive</text><text x="995.0" y="288.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">level V1</text></g><g class="node" data-id="evidence_supported" tabindex="0"><title>FindingStatus.EVIDENCE_SUPPORTED</title><rect x="920" y="410" width="150" height="50" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="995.0" y="432.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">evidence supported</text><text x="995.0" y="448.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">level V1</text></g><g class="node" data-id="accepted" tabindex="0"><title>FindingStatus.ACCEPTED</title><rect x="1180" y="150" width="130" height="50" rx="7" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.4"/><text x="1245.0" y="172.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">accepted</text><text x="1245.0" y="188.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">level V3</text></g><g class="node" data-id="rejected" tabindex="0"><title>FindingStatus.REJECTED</title><rect x="1180" y="370" width="130" height="50" rx="7" fill="#fde7e4" stroke="#c0392b" stroke-width="1.4"/><text x="1245.0" y="392.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">rejected</text><text x="1245.0" y="408.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">level V1</text></g><g class="node" data-id="resolved" tabindex="0"><title>FindingStatus.RESOLVED</title><rect x="1400" y="90" width="120" height="50" rx="7" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.4"/><text x="1460.0" y="112.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">resolved</text><text x="1460.0" y="128.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">level V3</text></g><g class="node" data-id="wont_fix" tabindex="0"><title>FindingStatus.WONT_FIX</title><rect x="1400" y="210" width="120" height="50" rx="7" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.4"/><text x="1460.0" y="232.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">wont fix</text><text x="1460.0" y="248.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">level V3</text></g><g class="node" data-id="start"><circle cx="45" cy="275" r="7" fill="#1b2430"/></g><g class="node" data-id="end-rejected"><circle cx="1372" cy="395" r="9" fill="#fff" stroke="#1b2430" stroke-width="1.5"/><circle cx="1372" cy="395" r="5" fill="#1b2430"/></g><g class="node" data-id="end-resolved"><circle cx="1565" cy="115" r="9" fill="#fff" stroke="#1b2430" stroke-width="1.5"/><circle cx="1565" cy="115" r="5" fill="#1b2430"/></g><g class="node" data-id="end-wont_fix"><circle cx="1565" cy="235" r="9" fill="#fff" stroke="#1b2430" stroke-width="1.5"/><circle cx="1565" cy="235" r="5" fill="#1b2430"/></g><g class="note"><path d="M60 420 H348 L360 432 V509 H60 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.1"/><path d="M348 420 V432 H360" fill="none" stroke="#7b8696" stroke-width="1.1"/><text x="70.0" y="438.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">How to read it</text><text x="70.0" y="453.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">Labels are the events in granite_core.lifecycle.</text><text x="70.0" y="468.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">An event not drawn from a state is refused:</text><text x="70.0" y="483.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">transition() raises, the API answers 409</text><text x="70.0" y="498.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">and lists the allowed actions.</text></g><g class="note"><path d="M1150 470 H1538 L1550 482 V544 H1150 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.1"/><path d="M1538 470 V482 H1550" fill="none" stroke="#7b8696" stroke-width="1.1"/><text x="1160.0" y="488.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Composite state</text><text x="1160.0" y="503.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">review_accept and review_reject leave from each of</text><text x="1160.0" y="518.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">the three states inside &#x27;awaiting review&#x27;.</text><text x="1160.0" y="533.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">request_info is recorded without changing the state.</text></g><text x="275.0" y="268.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">hypotheses_ready</text><text x="565.0" y="258.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">verify_started</text><text x="565.0" y="303.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">verify_error</text><text x="845.0" y="258.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">verdict_inconclusive</text><text x="845.0" y="303.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">verify_started</text><text x="812.0" y="108.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">verdict_confirmed</text><text x="677.0" y="360.0" text-anchor="end" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">verdict_refuted</text><text x="733.0" y="360.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">verify_started</text><text x="700.0" y="553.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">evidence_supported</text><text x="1322.0" y="108.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">resolve</text><text x="1363.0" y="200.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">wont_fix</text><text x="1135.0" y="168.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">review_accept</text><text x="1135.0" y="388.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">review_reject</text></svg>
