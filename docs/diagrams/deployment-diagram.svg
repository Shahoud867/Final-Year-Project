text x="145.0" y="354.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">SQLite file</text><text x="145.0" y="370.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">apps/api/.granite/</text><text x="145.0" y="385.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">granite.db</text></g><g class="node" data-id="ollama" tabindex="0"><rect x="260" y="320" width="170" height="66" rx="7" fill="#eef1f5" stroke="#66717f" stroke-width="1.4"/><text x="345.0" y="343.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">«process» Ollama</text><text x="345.0" y="359.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">optional · port 11434</text><text x="345.0" y="374.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">llama3.2:3b, live mode</text></g><g class="node" data-id="repo" tabindex="0"><rect x="530" y="100" width="370" height="54" rx="7" fill="#f4f6f9" stroke="#55606e" stroke-width="1.4"/><text x="715.0" y="124.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Repository</text><text x="715.0" y="140.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Shahoud867/Final-Year-Project · branch main</text></g><g class="node" data-id="ci" tabindex="0"><rect x="530" y="200" width="370" height="92" rx="7" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><text x="715.0" y="228.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">«pipeline» GitHub Actions: CI</text><text x="715.0" y="244.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Python: lint, types, tests, security scans</text><text x="715.0" y="259.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Web: lint, types, tests, build · secret scan</text><text x="715.0" y="274.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">Container: build image, smoke test inside it</text></g><g class="node" data-id="cd" tabindex="0"><rect x="530" y="340" width="370" height="80" rx="7" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><text x="715.0" y="362.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">«pipeline» GitHub Actions: CD</text><text x="715.0" y="378.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">after CI passes on main: build the image,</text><text x="715.0" y="393.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">smoke-test it, publish it to ghcr.io,</text><text x="715.0" y="408.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">then call the Render deploy hook</text></g><g class="node" data-id="oauth" tabindex="0"><rect x="530" y="470" width="370" height="60" rx="7" fill="#ffffff" stroke="#9aa4b1" stroke-width="1.4" stroke-dasharray="6 4"/><text x="715.0" y="497.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">GitHub sign-in (OAuth)</text><text x="715.0" y="513.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">reviewer identity · FYP-2 Mid</text></g><g class="node" data-id="visitor" tabindex="0"><rect x="1000" y="100" width="360" height="54" rx="7" fill="#f0eafc" stroke="#6f4fc7" stroke-width="1.4"/><text x="1180.0" y="124.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Visitor&#x27;s browser</text><text x="1180.0" y="140.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">https://granite-demo.onrender.com</text></g><g class="node" data-id="container" tabindex="0"><rect x="1000" y="200" width="360" height="64" rx="7" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><text x="1180.0" y="222.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">«container» granite-demo</text><text x="1180.0" y="238.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">recorded mode · port 8000 · /api/health</text><text x="1180.0" y="253.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">created from render.yaml</text></g><g class="node" data-id="tmpdisk" tabindex="0"><path d="M1000 327 A85.0 7 0 0 1 1170 327 V387 A85.0 7 0 0 1 1000 387 Z" fill="#f4f6f9" stroke="#55606e" stroke-width="1.4"/><path d="M1000 327 A85.0 7 0 0 0 1170 327" fill="none" stroke="#55606e" stroke-width="1.4"/><text x="1085.0" y="354.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Temporary disk</text><text x="1085.0" y="370.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">SQLite; resets on</text><text x="1085.0" y="385.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">restart or deploy</text></g><g class="node" data-id="pg" tabindex="0"><path d="M1190 327 A85.0 7 0 0 1 1360 327 V387 A85.0 7 0 0 1 1190 387 Z" fill="#ffffff" stroke="#9aa4b1" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M1190 327 A85.0 7 0 0 0 1360 327" fill="none" stroke="#9aa4b1" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1275.0" y="354.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">PostgreSQL</text><text x="1275.0" y="370.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">tested at FYP-1 Final,</text><text x="1275.0" y="385.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">deployed at FYP-2 Mid</text></g><g class="note"><path d="M720 600 H1378 L1390 612 V674 H720 Z" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.1"/><path d="M1378 600 V612 H1390" fill="none" stroke="#a86a00" stroke-width="1.1"/><text x="730.0" y="618.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Status (2026-10-22)</text><text x="730.0" y="633.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">Everything solid is verified. The demo has been live on Render since 11 October. Since 13 October</text><text x="730.0" y="648.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">CD calls the deploy hook once CI passes on main; Render builds the Dockerfile and CD then smoke-tests</text><text x="730.0" y="663.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">the public URL, so no step is manual. Dashed parts are planned for FYP-1 Final and FYP-2.</text></g><text x="157.0" y="182.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">HTTP :8000</text><text x="357.0" y="186.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">traces</text><text x="157.0" y="296.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">file</text><text x="357.0" y="296.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">HTTP</text><text x="495.0" y="120.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">git push</text><text x="727.0" y="182.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">push or pull request</text><text x="727.0" y="320.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">green on main</text><text x="956.0" y="300.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">deploy hook</text><text x="1192.0" y="182.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">HTTPS</text><text x="1287.0" y="296.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">SQL</text><text x="942.0" y="494.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">sign-in</text><g class="legend"><rect x="30" y="600" width="661" height="68" rx="7" fill="#ffffff" 