[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-refund-desk"
version = "0.1.0"
description = "Refund Desk: a five-step multi-agent refund workflow on tau-bench retail data, used as Granite's first system under test."
requires-python = ">=3.11"
dependencies = ["granite-core"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["refund_desk*"]

[tool.setuptools.package-data]
refund_desk = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "../../packages/granite_core"
plugins = ["pydantic.mypy"]
