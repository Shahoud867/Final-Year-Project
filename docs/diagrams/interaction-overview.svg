<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 470" width="1560" height="470" role="img" aria-labelledby="interaction-overview-t interaction-overview-d" data-diagram="interaction-overview"><title id="interaction-overview-t">Interaction overview diagram</title><desc id="interaction-overview-d">How the three interactions (run, verify, review) follow one another, with the decisions between them.</desc><style>text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;} .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;} .node:focus{outline:none;} .node:focus > :first-child, .node:focus > rect{stroke-width:2.6;}</style><defs><marker id="interaction-overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b8696"/></marker><marker id="interaction-overview-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7b8696" stroke-width="1.6"/></marker><marker id="interaction-overview-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="interaction-overview-diamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#7b8696"/></marker><marker id="interaction-overview-odiamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="interaction-overview-many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M2 6 L12 1 M2 6 L12 11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="interaction-overview-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M7 1 V11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="interaction-overview-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#7b8696"/></marker></defs><rect width="1560" height="470" fill="#ffffff"/><g class="edge" data-from="start" data-to="io-run"><path d="M57.0 170.0 L100.0 170.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#interaction-overview-arrow)"/></g><g class="edge" data-from="io-run" data-to="io-q1"><path d="M340.0 170.0 L410.0 170.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#interaction-overview-arrow)"/></g><g class="edge" data-from="io-q1" data-to="io-verify"><title>yes</title><path d="M600.0 170.0 L670.0 170.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#interaction-overview-arrow)"/></g><g class="edge" data-from="io-q1" data-to="end-clean"><path d="M505.0 207.0 L505.0 291.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#interaction-overview-arrow)"/></g><g class="edge" data-from="io-verify" data-to="io-q2"><path d="M910.0 170.0 L980.0 170.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#interaction-overview-arrow)"/></g><g class="edge" data-from="io-q2" data-to="io-review"><title>yes</title><path d="M1170.0 170.0 L1240.0 170.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#interaction-overview-arrow)"/></g><g class="edge" data-from="io-q2" data-to="io-verify"><title>no: next hypothesis, or more replays</title><path d="M1075.0 207.0 L1075.0 281.0 Q1075.0 290.0 1066.0 290.0 L799.0 290.0 Q790.0 290.0 790.0 281.0 L790.0 220.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#interaction-overview-arrow)"/></g><g class="edge" data-from="io-review" data-to="end"><path d="M1480.0 170.0 L1521.0 170.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#interaction-overview-arrow)"/></g><g class="edge" data-from="io-verify" data-to="io-review"><title>no replay is defined for the step: review on the evidence</title><path d="M742.0 120.0 L742.0 69.0 Q742.0 60.0 751.0 60.0 L1351.0 60.0 Q1360.0 60.0 1360.0 69.0 L1360.0 120.0" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#interaction-overview-arrow)"/></g><g class="node" data-id="start"><circle cx="50" cy="170" r="7" fill="#1b2430"/></g><g class="node" data-id="io-run" tabindex="0"><rect x="100" y="120" width="240" height="100" rx="4" fill="#e2f5f1" stroke="#1b8576" stroke-width="1.4"/><path d="M100 120 H129.1758 V134 L121.17580000000001 142 H100 Z" fill="#ffffff" stroke="#1b8576" stroke-width="1.2"/><text x="107.0" y="136.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b8576;">ref</text><text x="220.0" y="171.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">sd Run and analyse</text><text x="220.0" y="187.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">sequence diagram: run-sequence</text><text x="220.0" y="202.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">POST /api/runs to a finding</text></g><g class="node" data-id="io-q1" tabindex="0"><path d="M505.0 133 L600 170.0 L505.0 207 L410 170.0 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="505.0" y="175.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Finding opened?</text></g><g class="node" data-id="io-verify" tabindex="0"><rect x="670" y="120" width="240" height="100" rx="4" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><path d="M670 120 H699.1758 V134 L691.1758 142 H670 Z" fill="#ffffff" stroke="#3b6fd4" stroke-width="1.2"/><text x="677.0" y="136.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#3b6fd4;">ref</text><text x="790.0" y="171.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">sd Verify a hypothesis</text><text x="790.0" y="187.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">sequence diagram: verification-sequence</text><text x="790.0" y="202.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">N replays, M controls, verdict</text></g><g class="node" data-id="io-q2" tabindex="0"><path d="M1075.0 133 L1170 170.0 L1075.0 207 L980 170.0 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="1075.0" y="175.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Origin confirmed?</text></g><g class="node" data-id="io-review" tabindex="0"><rect x="1240" y="120" width="240" height="100" rx="4" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.4"/><path d="M1240 120 H1269.1758 V134 L1261.1758 142 H1240 Z" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.2"/><text x="1247.0" y="136.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#3d4a5c;">ref</text><text x="1360.0" y="171.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">sd Review and record</text><text x="1360.0" y="187.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">accept, reject or ask;</text><text x="1360.0" y="202.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">audit entry and report</text></g><g class="node" data-id="end"><circle cx="1530" cy="170" r="9" fill="#fff" stroke="#1b2430" stroke-width="1.5"/><circle cx="1530" cy="170" r="5" fill="#1b2430"/></g><g class="node" data-id="end-clean"><circle cx="505" cy="300" r="9" fill="#fff" stroke="#1b2430" stroke-width="1.5"/><circle cx="505" cy="300" r="5" fill="#1b2430"/></g><g class="note"><path d="M100 340 H468 L480 352 V414 H100 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.1"/><path d="M468 340 V352 H480" fill="none" stroke="#7b8696" stroke-width="1.1"/><text x="110.0" y="358.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Reading the diagram</text><text x="110.0" y="373.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">Each &#x27;ref&#x27; box stands for a whole interaction that has its own</text><text x="110.0" y="388.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">sequence diagram in this pack. Diamonds are decisions</text><text x="110.0" y="403.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">taken from stored state, not from the user&#x27;s memory.</text></g><text x="635.0" y="163.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">yes</text><text x="517.0" y="255.0" text-anchor="start" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">no: clean run</text><text x="1205.0" y="163.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">yes</text><text x="932.0" y="284.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">no: next hypothesis, or more replays</text><text x="1050.0" y="54.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">no replay is defined for the step: review on the evidence</text></svg>
