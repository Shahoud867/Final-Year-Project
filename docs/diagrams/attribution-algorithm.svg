<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" width="1320" height="800" role="img" aria-labelledby="attribution-algorithm-t attribution-algorithm-d" data-diagram="attribution-algorithm"><title id="attribution-algorithm-t">Attribution: ranking where a failure began</title><desc id="attribution-algorithm-d">The provenance-first ranking algorithm with its weights and a worked example from a recorded run.</desc><style>text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;} .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;} .node:focus{outline:none;} .node:focus > :first-child, .node:focus > rect{stroke-width:2.6;}</style><defs><marker id="attribution-algorithm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b8696"/></marker><marker id="attribution-algorithm-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7b8696" stroke-width="1.6"/></marker><marker id="attribution-algorithm-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="attribution-algorithm-diamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#7b8696"/></marker><marker id="attribution-algorithm-odiamond" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M0 5 L8 0 L16 5 L8 10 Z" fill="#fff" stroke="#7b8696" stroke-width="1.3"/></marker><marker id="attribution-algorithm-many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M2 6 L12 1 M2 6 L12 11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="attribution-algorithm-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 6 H12 M7 1 V11" fill="none" stroke="#7b8696" stroke-width="1.4"/></marker><marker id="attribution-algorithm-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#7b8696"/></marker></defs><rect width="1320" height="800" fill="#ffffff"/><g class="edge" data-from="in" data-to="walk"><path d="M270.0 94.0 L270.0 134.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#attribution-algorithm-arrow)"/></g><g class="edge" data-from="walk" data-to="classify"><path d="M270.0 204.0 L270.0 244.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#attribution-algorithm-arrow)"/></g><g class="edge" data-from="classify" data-to="score"><path d="M270.0 314.0 L270.0 354.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#attribution-algorithm-arrow)"/></g><g class="edge" data-from="score" data-to="q"><path d="M270.0 410.0 L270.0 450.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#attribution-algorithm-arrow)"/></g><g class="edge" data-from="q" data-to="prov"><title>yes</title><path d="M270.0 528.0 L270.0 549.0 Q270.0 558.0 261.0 558.0 L161.5 558.0 Q152.5 558.0 152.5 567.0 L152.5 590.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#attribution-algorithm-arrow)"/></g><g class="edge" data-from="q" data-to="struct"><title>no</title><path d="M270.0 528.0 L270.0 549.0 Q270.0 558.0 279.0 558.0 L378.5 558.0 Q387.5 558.0 387.5 567.0 L387.5 590.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#attribution-algorithm-arrow)"/></g><g class="edge" data-from="prov" data-to="out"><path d="M152.5 660.0 L152.5 686.2 Q152.5 690.0 156.2 690.0 L156.2 690.0 Q160.0 690.0 160.0 693.8 L160.0 716.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#attribution-algorithm-arrow)"/></g><g class="edge" data-from="struct" data-to="out"><path d="M387.5 660.0 L387.5 686.2 Q387.5 690.0 383.8 690.0 L383.8 690.0 Q380.0 690.0 380.0 693.8 L380.0 716.0" fill="none" stroke="#7b8696" stroke-width="1.5" marker-end="url(#attribution-algorithm-arrow)"/></g><g class="node" data-id="in" tabindex="0"><rect x="80" y="50" width="380" height="44" rx="22.0" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.4"/><text x="270.0" y="77.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Input: trace, check results, symptom step</text></g><g class="node" data-id="walk" tabindex="0"><rect x="50" y="134" width="440" height="70" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="270.0" y="159.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">1  Walk the recorded reads backwards</text><text x="270.0" y="175.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">breadth-first from the symptom step; hop distance per ancestor</text><text x="270.0" y="190.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">(a revisit bound of 3 keeps an imported cyclic trace finite)</text></g><g class="node" data-id="classify" tabindex="0"><rect x="50" y="244" width="440" height="70" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="270.0" y="269.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">2  Classify each ancestor by its strongest evidence</text><text x="270.0" y="285.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">from that step&#x27;s own checks: truth mismatch, contract failure,</text><text x="270.0" y="300.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">handoff drift, nothing known, or consistent</text></g><g class="node" data-id="score" tabindex="0"><rect x="50" y="354" width="440" height="56" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="270.0" y="379.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">3  Score = evidence weight × 0.9 ^ hops</text><text x="270.0" y="395.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">closer steps win ties; scores are not probabilities</text></g><g class="node" data-id="q" tabindex="0"><path d="M270.0 450 L420 489.0 L270.0 528 L120 489.0 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.4"/><text x="270.0" y="494.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Any step with weight ≥ 0.7?</text></g><g class="node" data-id="prov" tabindex="0"><rect x="50" y="590" width="205" height="70" rx="7" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.4"/><text x="152.5" y="615.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Provenance ranking</text><text x="152.5" y="631.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">sort by score;</text><text x="152.5" y="646.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">method = provenance</text></g><g class="node" data-id="struct" tabindex="0"><rect x="285" y="590" width="205" height="70" rx="7" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.4"/><text x="387.5" y="615.0" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Structural fallback</text><text x="387.5" y="631.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">position on paths to the</text><text x="387.5" y="646.0" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">symptom, cleared steps last</text></g><g class="node" data-id="out" tabindex="0"><rect x="80" y="716" width="380" height="50" rx="7" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="270.0" y="738.5" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:#1b2430;">Keep the best 5 as hypotheses</text><text x="270.0" y="754.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#586474;">each with a rationale and its evidence</text></g><g class="node" data-id="weights" tabindex="0"><title>granite_core.attribution.WEIGHTS</title><rect x="570" y="50" width="330" height="158.5" rx="6" fill="#ffffff" stroke="#3b6fd4" stroke-width="1.4"/><path d="M570 78 H900 V56 Q900 50 894 50 H576 Q570 50 570 56 Z" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/><text x="735.0" y="69.0" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#1b2430;">Evidence weights</text><text x="579.0" y="95.0" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#1b2430;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">truth_mismatch   1.0  origin evidence</text><text x="579.0" y="110.5" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#1b2430;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">contract_fail    0.8  origin evidence</text><text x="579.0" y="126.0" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#1b2430;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">handoff_drift    0.7  origin evidence</text><text x="579.0" y="141.5" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#1b2430;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">unknown          0.2</text><text x="579.0" y="157.0" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#1b2430;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">consistent       0.1</text><path d="M570 167.5 H900" stroke="#3b6fd4" stroke-width="1"/><text x="579.0" y="183.5" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#586474;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">origin threshold 0.7 · decay 0.9/hop</text><text x="579.0" y="199.0" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#586474;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">at most 5 hypotheses</text></g><g class="note"><path d="M940 50 H1268 L1280 62 V184 H940 Z" fill="#ffffff" stroke="#7b8696" stroke-width="1.1"/><path d="M1268 50 V62 H1280" fill="none" stroke="#7b8696" stroke-width="1.1"/><text x="950.0" y="68.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">What the evidence kinds mean</text><text x="950.0" y="83.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">truth_mismatch: the step&#x27;s output contradicts the</text><text x="950.0" y="98.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">  source of truth</text><text x="950.0" y="113.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">contract_fail: the step broke its own contract</text><text x="950.0" y="128.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">handoff_drift: it received something other than</text><text x="950.0" y="143.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">  what was produced upstream</text><text x="950.0" y="158.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">unknown: no check covers the step</text><text x="950.0" y="173.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">consistent: its checks passed</text></g><g class="node" data-id="example" tabindex="0"><title>computed by attribute() on the recorded run when the pack is built</title><rect x="570" y="300" width="420" height="158.5" rx="6" fill="#ffffff" stroke="#b0731a" stroke-width="1.4"/><path d="M570 328 H990 V306 Q990 300 984 300 H576 Q570 300 570 306 Z" fill="#fdf2d9" stroke="#b0731a" stroke-width="1.4"/><text x="780.0" y="319.0" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#1b2430;">Worked example (recorded run)</text><text x="579.0" y="345.0" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#1b2430;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">1 Order Lookup      truth_mismatch  0.81</text><text x="579.0" y="360.5" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#1b2430;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">2 Refund Calculator contract_fail   0.72</text><text x="579.0" y="376.0" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#1b2430;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">3 Writer            consistent      0.10</text><text x="579.0" y="391.5" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#1b2430;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">4 Policy            consistent      0.09</text><text x="579.0" y="407.0" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#1b2430;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">5 Intake            consistent      0.08</text><path d="M570 417.5 H990" stroke="#b0731a" stroke-width="1"/><text x="579.0" y="433.5" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#586474;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">task #W1023987, fault stale_price</text><text x="579.0" y="449.0" text-anchor="start" style="font-size:10.8px;font-weight:400;fill:#586474;font-family:ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;">symptom at s5: CHK-OUT-1 failed</text></g><g class="note"><path d="M570 530 H978 L990 542 V604 H570 Z" fill="#e3f4e9" stroke="#1d7a46" stroke-width="1.1"/><path d="M978 530 V542 H990" fill="none" stroke="#1d7a46" stroke-width="1.1"/><text x="580.0" y="548.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Checked against ground truth</text><text x="580.0" y="563.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">The fault was injected at s2 (items[0].price:</text><text x="580.0" y="578.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">452.28 became 452.03). Rank 1 is s2: it matches.</text><text x="580.0" y="593.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">attribute() never receives the fault record.</text></g><g class="note"><path d="M1030 300 H1268 L1280 312 V419 H1030 Z" fill="#fdf0d0" stroke="#a86a00" stroke-width="1.1"/><path d="M1268 300 V312 H1280" fill="none" stroke="#a86a00" stroke-width="1.1"/><text x="1040.0" y="318.0" text-anchor="start" style="font-size:11px;font-weight:700;fill:#1b2430;">Limits</text><text x="1040.0" y="333.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">A step with no check can only be</text><text x="1040.0" y="348.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">&#x27;unknown&#x27; (0.2). Weights are design</text><text x="1040.0" y="363.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">choices, fixed before the feasibility</text><text x="1040.0" y="378.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">run; they were not tuned on its</text><text x="1040.0" y="393.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">results. Cost: one backward walk,</text><text x="1040.0" y="408.0" text-anchor="start" style="font-size:11px;font-weight:400;fill:#1b2430;">linear in steps plus reads.</text></g><text x="211.2" y="552.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">yes</text><text x="328.8" y="552.0" text-anchor="middle" style="font-size:10.8px;font-weight:500;fill:#586474;" class="halo">no</text></svg>
